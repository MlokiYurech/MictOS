<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mict OS</title>
<link rel="icon" href="/favicom.png?v=3">

<script>
(function(){
  try{
    var uid = localStorage.getItem('mict-uid');
    if(!uid){
      uid = 'u-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8);
      localStorage.setItem('mict-uid', uid);
    }
    window.__MICT_UID = uid;
    var s = localStorage.getItem('mict-theme-' + uid);
    if(s==='light') document.documentElement.setAttribute('data-theme','light');
    var scale = localStorage.getItem('mict-scale-' + uid);
    if(scale) document.documentElement.style.setProperty('--ui-scale', scale);
    var accent = localStorage.getItem('mict-accent-' + uid);
    if(accent) document.documentElement.style.setProperty('--accent', accent);
  }catch(e){}
})();
</script>

<style>
:root{
  --bg:#070707;--panel:rgba(255,255,255,0.03);--panel2:rgba(255,255,255,0.06);
  --text:#f4f4f4;--muted:#9a9a9a;
  --accent:#e10600;--accent-2:#ff2a23;
  --accent-soft:rgba(225,6,0,.15);--accent-glow:rgba(225,6,0,.3);
  --line:rgba(255,255,255,0.06);
  --glass-bg:rgba(255,255,255,0.03);--glass-border:rgba(255,255,255,0.06);
  --glass-shadow:0 8px 32px rgba(0,0,0,0.4);
  --dot-close:#ff5f57;--dot-min:#febc2e;--dot-max:#28c840;
  --ui-scale:1;
  --topbar-h:64px;
  --bottombar-h:56px;
  --bg-custom:#070707;

  --r-xs:14px;--r-sm:18px;--r-md:24px;--r-lg:32px;--r-xl:40px;--r-2xl:48px;--r-pill:999px;
  --r-win:24px;--r-win-max:0px;--r-dock-app:12px;--r-startmenu:32px;--r-btn:999px;
  --r-topbar:0px;--r-dockcorner:30px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;overflow:hidden;
  -webkit-font-smoothing:antialiased;font-size:calc(14px * var(--ui-scale));
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
button,input,textarea,select{font-family:inherit;font-size:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--accent),var(--accent-2));border-radius:99px}

#bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bg-layer canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#os-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#os-bg .glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;animation:floatGlow 15s ease-in-out infinite alternate}
#os-bg .g1{width:520px;height:520px;right:-160px;top:-80px;background:radial-gradient(circle,var(--accent-glow),transparent 70%)}
#os-bg .g2{width:420px;height:420px;left:-140px;bottom:-100px;background:radial-gradient(circle,var(--accent-soft),transparent 70%);animation-delay:-7s}
#os-bg .g3{width:360px;height:360px;top:40%;left:45%;background:radial-gradient(circle,var(--accent-soft),transparent 70%);animation-delay:-12s}
@keyframes floatGlow{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-50px,30px,0) scale(1.12)}100%{transform:translate3d(30px,-30px,0) scale(.95)}}

#desktop{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column}

/* ===== TOPBAR: док всегда по центру экрана ===== */
#topbar{
  height:var(--topbar-h);flex:0 0 var(--topbar-h);display:flex;align-items:center;
  padding:0 14px;background:rgba(7,7,7,.42);
  backdrop-filter:blur(32px) saturate(1.4);-webkit-backdrop-filter:blur(32px) saturate(1.4);
  border-bottom:1px solid rgba(255,255,255,.06);z-index:100;position:relative;order:1;
  border-bottom-left-radius:var(--r-dockcorner);
  border-bottom-right-radius:var(--r-dockcorner);
  transition:border-radius .3s ease;
}
.tb-logo{
  display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 16px 6px 8px;border-radius:var(--r-pill);
  transition:all .35s cubic-bezier(.34,1.56,.64,1);user-select:none;flex-shrink:0;
  border:1px solid var(--accent);
  box-shadow:0 0 0 1px var(--accent-soft), 0 0 10px var(--accent-soft);
  touch-action:manipulation;
  position:relative;z-index:3;
}
.tb-logo:hover{background:rgba(255,255,255,.06);transform:scale(1.04);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-soft), 0 0 18px var(--accent-glow)}
.tb-logo:active{transform:scale(.98)}
.tb-logo .logo-img{width:34px;height:34px;object-fit:contain;flex-shrink:0;display:block}
.tb-logo .mark{font-weight:700;letter-spacing:-.02em;font-size:20px;color:#fff;font-family:Georgia,'Times New Roman',serif;font-style:italic}

/* Док — абсолютно по центру всего экрана */
.tb-dock{
  position:absolute;left:50%;transform:translateX(-50%);
  top:0;bottom:0;
  display:flex;align-items:center;justify-content:center;gap:8px;
  overflow-x:auto;overflow-y:hidden;padding:6px 10px;
  scrollbar-width:none;min-height:52px;
  max-width:calc(100% - 280px);
  z-index:1;
}
.tb-dock::-webkit-scrollbar{display:none}
.tb-dock .placeholder{color:#555;font-size:11px;letter-spacing:.18em;font-weight:700;white-space:nowrap;pointer-events:none}
.dock-app{
  width:40px;height:40px;flex:0 0 40px;border-radius:var(--r-dock-app);cursor:pointer;position:relative;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), background .25s ease, border-color .25s ease;
  animation:dockPop .4s cubic-bezier(.34,1.56,.64,1);color:#ddd;
  touch-action:manipulation;user-select:none;-webkit-user-drag:none;
}
@keyframes dockPop{from{opacity:0;transform:scale(.5) translateY(-10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.dock-app:hover{transform:translateY(-4px) scale(1.12);border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.1)}
.dock-app.active{border-color:var(--accent);background:linear-gradient(135deg,var(--accent-soft),transparent);color:#fff}
.dock-app::after{
  content:attr(data-label);position:absolute;top:-34px;left:50%;transform:translateX(-50%) scale(.85);
  background:rgba(15,15,15,.96);color:#fff;font-size:11px;font-weight:700;padding:5px 12px;
  border-radius:var(--r-pill);border:1px solid rgba(255,255,255,.08);white-space:nowrap;
  opacity:0;pointer-events:none;transition:all .25s ease;z-index:200;
}
.dock-app:hover::after{opacity:1;transform:translateX(-50%) scale(1)}
.dock-app .ind{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 8px var(--accent-2)}

.tb-hide-all{width:26px;height:30px;flex:0 0 26px;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:all .25s ease;margin-left:4px;touch-action:manipulation}
.tb-hide-all::before{content:'';width:2px;height:18px;border-radius:2px;background:linear-gradient(180deg,var(--accent),var(--accent-2));transition:all .25s ease;box-shadow:0 0 8px var(--accent-glow)}
.tb-hide-all:hover{background:rgba(255,255,255,.06);transform:scale(1.08)}
.tb-hide-all:hover::before{height:22px;width:3px}
.tb-hide-all:active{transform:scale(.92)}

body.icon-mono .dock-app .ico,
body.icon-mono #startMenu .sm-app .ic,
body.icon-mono .fm-file .ic,
body.icon-mono .fm-side .fm-lnk .ico,
body.icon-mono .gcard .gc-ico{filter: grayscale(1) brightness(1.4) contrast(1.05);color:#ddd}
body.icon-mono .dock-app.active .ico,
body.icon-mono #startMenu .sm-app:hover .ic{color:#fff}

body.icon-color .dock-app .ico,
body.icon-color #startMenu .sm-app .ic,
body.icon-color .fm-file .ic,
body.icon-color .fm-side .fm-lnk .ico,
body.icon-color .gcard .gc-ico{filter:none}

body.icon-flat .dock-app,
body.icon-flat #startMenu .sm-app .ic,
body.icon-flat .fm-file .ic,
body.icon-flat .fm-side .fm-lnk .ico{background:transparent;border-color:transparent}
body.icon-flat .dock-app:hover{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.06)}
body.icon-flat .dock-app.active{background:var(--accent-soft)}
body.icon-flat .dock-app.active .ico{color:var(--accent-2);opacity:1}
body.icon-flat #startMenu .sm-app:hover .ic{color:var(--accent-2)}
body.icon-flat .ico svg{stroke:currentColor}
body.icon-flat .ico{color:#9a9a9a;opacity:.9}

.ico{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;line-height:1}
.ico svg{width:100%;height:100%;display:block;stroke-linecap:round;stroke-linejoin:round;fill:none;stroke-width:1.6}
.ico.ico-lg{width:32px;height:32px}
.ico.ico-sm{width:16px;height:16px}

/* Правый блок всегда справа */
.tb-right{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:auto;position:relative;z-index:3}
.tb-btn{
  height:34px;padding:0 12px;border-radius:var(--r-btn);cursor:pointer;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  color:#ddd;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);touch-action:manipulation;
}
.tb-btn:hover{transform:translateY(-2px) scale(1.04);border-color:rgba(255,255,255,.2);color:#fff;background:rgba(255,255,255,.07)}
.tb-btn.icon-only{padding:0;width:34px;justify-content:center}
.tb-clock{font-variant-numeric:tabular-nums;color:#bbb;font-weight:700;font-size:12.5px;letter-spacing:.04em;padding:0 6px;cursor:pointer;transition:all .25s ease;border-radius:var(--r-pill)}
.tb-clock:hover{background:rgba(255,255,255,.06);color:#fff}
.tb-clock small{color:#666;font-weight:600;margin-left:5px;font-size:10.5px}

#bottomDock{
  height:var(--bottombar-h);flex:0 0 var(--bottombar-h);display:none;align-items:center;justify-content:center;gap:8px;
  padding:0 14px;background:rgba(7,7,7,.42);
  backdrop-filter:blur(32px) saturate(1.4);-webkit-backdrop-filter:blur(32px) saturate(1.4);
  border-top:1px solid rgba(255,255,255,.06);z-index:100;position:relative;order:3;
  border-top-left-radius:var(--r-dockcorner);
  border-top-right-radius:var(--r-dockcorner);
  min-height:52px;
}
#bottomDock .dock-app{width:38px;height:38px}
#bottomDock .dock-app::after{top:auto;bottom:-34px}
#bottomDock .dock-app .ind{bottom:auto;top:-4px}

body.dock-split #bottomDock{display:flex}
body.dock-split #topbar .tb-dock .placeholder{display:none}

body.dock-bottom #topbar{
  order:3;border-bottom:none;border-top:1px solid rgba(255,255,255,.06);
  border-bottom-left-radius:0;border-bottom-right-radius:0;
  border-top-left-radius:var(--r-dockcorner);
  border-top-right-radius:var(--r-dockcorner);
}
body.dock-bottom #topbar .dock-app::after{top:auto;bottom:-34px}
body.dock-bottom #topbar .dock-app .ind{bottom:auto;top:-4px}
body.dock-bottom #workspace{order:2}

body.dock-hidden #topbar .tb-dock{display:none}
body.dock-hidden #topbar{border-bottom-left-radius:0;border-bottom-right-radius:0}

#startMenu{
  position:fixed;top:70px;left:14px;width:340px;max-height:calc(100vh - 100px);
  background:rgba(14,14,16,.94);
  backdrop-filter:blur(34px) saturate(1.4);-webkit-backdrop-filter:blur(34px) saturate(1.4);
  border:1px solid rgba(255,255,255,.1);border-radius:var(--r-startmenu);
  box-shadow:0 30px 90px rgba(0,0,0,.75);z-index:500;
  padding:14px;display:none;flex-direction:column;gap:10px;overflow:auto;
  will-change:left,top;
}
#startMenu.on{display:flex;animation:startIn .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes startIn{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
#startMenu .sm-head{padding:6px 8px 10px;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:4px}
#startMenu .sm-head .title{font-size:16px;font-weight:900;letter-spacing:-.02em}
#startMenu .sm-head .title i{color:var(--accent);font-style:normal}
#startMenu .sm-head .sub{font-size:10px;color:#777;letter-spacing:.18em;font-weight:700;text-transform:uppercase;margin-top:3px}
#startMenu .sm-search{
  width:100%;padding:9px 14px;border-radius:var(--r-pill);
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  color:#fff;outline:none;font-size:12px;margin-bottom:2px;
}
#startMenu .sm-search::placeholder{color:#666}
#startMenu .sm-search:focus{border-color:var(--accent);box-shadow:0 0 20px var(--accent-soft)}
#startMenu .sm-sect{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#666;font-weight:800;padding:8px 10px 4px}
#startMenu .sm-app{
  display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--r-sm);cursor:grab;
  transition:all .28s ease;color:#ddd;touch-action:none;
  user-select:none;-webkit-user-drag:none;
  position:relative;
}
#startMenu .sm-app:active{cursor:grabbing}
#startMenu .sm-app:hover{background:rgba(255,255,255,.07);color:#fff;transform:translateX(3px)}
#startMenu .sm-app .ic{
  width:34px;height:34px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);
  transition:all .3s ease;
}
#startMenu .sm-app .ic .ico{width:20px;height:20px}
#startMenu .sm-app:hover .ic{background:var(--accent-soft);border-color:var(--accent)}
#startMenu .sm-app .txt{flex:1;min-width:0}
#startMenu .sm-app .txt b{display:block;font-size:13px;font-weight:800;color:#eee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#startMenu .sm-app .txt small{font-size:10.5px;color:#777;letter-spacing:.02em}
#startMenu .sm-foot{display:flex;gap:6px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06);margin-top:4px;flex-wrap:wrap}
#startMenu .sm-foot .sm-btn{
  flex:1;min-width:0;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  color:#ccc;font-size:11px;font-weight:700;text-align:center;
  transition:all .28s ease;white-space:nowrap;touch-action:manipulation;
}
#startMenu .sm-foot .sm-btn:hover{background:rgba(255,255,255,.09);color:#fff;transform:translateY(-2px)}
#startMenu .sm-foot .sm-btn.exit{color:#ff9a9a;border-color:rgba(255,80,80,.25)}
#startMenu .sm-foot .sm-btn.exit:hover{background:var(--accent-soft);color:#fff}

#workspace{position:relative;flex:1;overflow:hidden;order:2}

.win{
  position:absolute;min-width:340px;min-height:200px;
  background:rgba(16,16,18,.9);
  backdrop-filter:blur(34px) saturate(1.4);-webkit-backdrop-filter:blur(34px) saturate(1.4);
  border:1px solid rgba(255,255,255,.08);
  border-radius:var(--r-win);overflow:hidden;
  box-shadow:0 30px 90px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.04);
  display:flex;flex-direction:column;z-index:5;
  animation:winOpen .35s cubic-bezier(.34,1.56,.64,1);
  touch-action:none;
  transform-origin:bottom center;
  will-change:transform,opacity;
}
.win.max{inset:0 !important;width:100% !important;height:100% !important;border-radius:var(--r-win-max)}
.win.min{display:none !important}
.win.no-anim{animation:none !important}
@keyframes winOpen{from{opacity:0;transform:scale(.9) translateY(30px)}to{opacity:1;transform:scale(1) translateY(0)}}
.win-head{
  height:56px;flex:0 0 56px;display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;padding:0 14px;cursor:grab;user-select:none;position:relative;
  background:rgba(255,255,255,.02);
  touch-action:none;
}
.win-head:active{cursor:grabbing}
.win-head .head-left{display:flex;justify-content:flex-start}
.win-head .head-left .pill{
  padding:7px 16px;border-radius:var(--r-pill);
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07);
  color:#ccc;font-size:11.5px;font-weight:700;letter-spacing:.02em;
  transition:all .3s ease;cursor:pointer;white-space:nowrap;touch-action:manipulation;
}
.win-head .head-left .pill:hover{background:rgba(255,255,255,.1);color:#fff}
.win-dots{display:flex;gap:9px;justify-content:center}
.win-dots i{
  width:14px;height:14px;border-radius:50%;display:block;cursor:pointer;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);position:relative;
  touch-action:manipulation;
}
.win-dots i:hover{transform:scale(1.22)}
.win-dots i.close{background:var(--dot-close)}
.win-dots i.min{background:var(--dot-min)}
.win-dots i.max{background:var(--dot-max)}
.win-dots i:active{transform:scale(.9)}
.win-head .head-right{display:flex;justify-content:flex-end;gap:6px;align-items:center}
.win-head .head-right .pill{
  padding:7px 16px;border-radius:var(--r-pill);
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07);
  color:#ccc;font-size:11.5px;font-weight:700;letter-spacing:.02em;
  transition:all .3s ease;cursor:pointer;white-space:nowrap;touch-action:manipulation;
}
.win-head .head-right .pill:hover{background:rgba(255,255,255,.1);color:#fff}
.win-body{flex:1;overflow:auto;position:relative;touch-action:pan-y pan-x}

.win-resize{position:absolute;z-index:20;touch-action:none}
.win-resize.n{top:-3px;left:12px;right:12px;height:8px;cursor:n-resize}
.win-resize.s{bottom:-3px;left:12px;right:12px;height:8px;cursor:s-resize}
.win-resize.e{right:-3px;top:12px;bottom:12px;width:8px;cursor:e-resize}
.win-resize.w{left:-3px;top:12px;bottom:12px;width:8px;cursor:w-resize}
.win-resize.ne{top:-4px;right:-4px;width:16px;height:16px;cursor:ne-resize}
.win-resize.nw{top:-4px;left:-4px;width:16px;height:16px;cursor:nw-resize}
.win-resize.se{bottom:-4px;right:-4px;width:16px;height:16px;cursor:se-resize}
.win-resize.sw{bottom:-4px;left:-4px;width:16px;height:16px;cursor:sw-resize}

.win-head .win-dots{order:2}
.win-head .head-left{order:1}
.win-head .head-right{order:3}
body.win-btns-left .win-head .win-dots{order:1;justify-content:flex-start}
body.win-btns-left .win-head .head-left{order:2;justify-content:center}
body.win-btns-left .win-head .head-right{order:3}
body.win-btns-right .win-head .win-dots{order:3;justify-content:flex-end}
body.win-btns-right .win-head .head-left{order:1}
body.win-btns-right .win-head .head-right{order:2}

.snap-hint{
  position:fixed;z-index:9995;pointer-events:none;
  background:var(--accent-soft);border:2px solid var(--accent);
  border-radius:12px;opacity:0;transition:opacity .15s ease;
  box-shadow:0 0 40px var(--accent-glow);
}
.snap-hint.on{opacity:1}

/* Проводник */
.fm{display:flex;height:100%}
.fm-side{width:190px;flex:0 0 190px;border-right:1px solid rgba(255,255,255,.06);padding:12px 8px;overflow:auto;background:rgba(0,0,0,.18)}
.fm-side .fm-sect{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#666;font-weight:800;padding:10px 10px 6px}
.fm-side .fm-lnk{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-xs);cursor:pointer;color:#bbb;font-size:12.5px;font-weight:600;transition:all .25s ease;touch-action:manipulation}
.fm-side .fm-lnk:hover{background:rgba(255,255,255,.06);color:#fff;transform:translateX(3px)}
.fm-side .fm-lnk.active{background:linear-gradient(135deg, var(--accent-soft), transparent);color:#fff;border:1px solid var(--accent)}
.fm-side .fm-lnk.drop-target{background:var(--accent-soft);border:1px dashed var(--accent);color:#fff}
.fm-side .fm-lnk .ico{font-size:15px;width:20px;height:20px}
.fm-main{flex:1;display:flex;flex-direction:column;min-width:0}
.fm-toolbar{display:flex;align-items:center;gap:7px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);flex-wrap:wrap}
.fm-toolbar button{height:32px;padding:0 13px;border-radius:var(--r-pill);cursor:pointer;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#ccc;font-size:11.5px;font-weight:700;transition:all .3s ease;touch-action:manipulation}
.fm-toolbar button:hover{background:rgba(255,255,255,.08);color:#fff;transform:translateY(-2px)}
.fm-path{flex:1;min-width:120px;font-size:11.5px;color:#888;font-family:ui-monospace,Menlo,monospace;background:rgba(0,0,0,.25);padding:7px 14px;border-radius:var(--r-pill);border:1px solid rgba(255,255,255,.06);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fm-grid{flex:1;overflow:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:9px;align-content:start;position:relative;touch-action:pan-y pan-x}
.fm-file{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px;border-radius:var(--r-sm);cursor:pointer;border:1px solid transparent;transition:all .28s ease;text-align:center;user-select:none;position:relative;touch-action:manipulation}
.fm-file:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1);transform:translateY(-3px)}
.fm-file.sel{background:var(--accent-soft);border-color:var(--accent)}
.fm-file.dragging{opacity:.4}
.fm-file.drop-target{background:var(--accent-soft);border-color:var(--accent);border-style:dashed}
.fm-file .ic{font-size:32px;line-height:1;pointer-events:none;display:flex;align-items:center;justify-content:center;width:38px;height:38px}
.fm-file .ic .ico{width:34px;height:34px}
.fm-file .nm{font-size:10.5px;color:#ccc;word-break:break-word;line-height:1.3;max-height:2.6em;overflow:hidden;pointer-events:none}
.fm-empty{color:#666;font-size:12px;padding:40px;text-align:center;grid-column:1/-1}
.fm-drop-hint{position:absolute;inset:0;pointer-events:none;border-radius:var(--r-md);background:var(--accent-soft);border:2px dashed var(--accent);display:none;align-items:center;justify-content:center;color:#fff;font-weight:800}
.fm-grid.dragover .fm-drop-hint{display:flex}
.fm-drop-hint .txt{background:rgba(0,0,0,.7);padding:10px 20px;border-radius:var(--r-pill);font-size:12px;letter-spacing:.04em}

/* Терминал */
.term{height:100%;background:rgba(0,0,0,.5);padding:14px 16px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;color:#d6d6d6}
.term .ln{white-space:pre-wrap;word-break:break-word}
.term .ok{color:#4ade80}
.term .err{color:#ff5f57}
.term .warn{color:#febc2e}
.term .dim{color:#777}
.term .hi{color:var(--accent-2);font-weight:700}
.term .inp{display:flex;gap:8px;align-items:center;margin-top:4px}
.term .inp span{color:var(--accent-2);font-weight:700;white-space:nowrap}
.term .inp input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-family:inherit;font-size:inherit;padding:2px 0}

/* Калькулятор */
.calc{display:flex;flex-direction:column;height:100%;padding:14px;gap:12px}
.calc-display{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.07);border-radius:var(--r-md);padding:14px 18px;text-align:right;display:flex;flex-direction:column;justify-content:flex-end;min-height:100px}
.calc-display .expr{font-size:12px;color:#777;min-height:16px;font-family:ui-monospace,monospace;word-break:break-all}
.calc-display .val{font-size:36px;font-weight:800;letter-spacing:-.03em;color:#fff;font-variant-numeric:tabular-nums;word-break:break-all;line-height:1.1}
.calc-keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc-keys button{border-radius:16px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#eee;font-size:17px;font-weight:700;cursor:pointer;transition:all .22s cubic-bezier(.34,1.56,.64,1);touch-action:manipulation}
.calc-keys button:hover{background:rgba(255,255,255,.09);transform:translateY(-2px) scale(1.03);border-color:rgba(255,255,255,.18)}
.calc-keys button:active{transform:scale(.94)}
.calc-keys button.op{color:var(--accent-2);background:var(--accent-soft);border-color:var(--accent)}
.calc-keys button.eq{background:linear-gradient(135deg,color-mix(in srgb, var(--accent) 70%, #000),var(--accent));border-color:var(--accent);color:#fff}
.calc-keys button.fn{color:#aaa;font-size:15px}

/* Медиа */
.media-hub{padding:16px;height:100%;overflow:auto}
.media-hub h3{margin:0 0 8px;font-size:13px;color:#aaa;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.media-hub .sub{color:#666;font-size:11px;margin-bottom:14px}
.media-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.media-tabs button{padding:7px 14px;border-radius:var(--r-pill);cursor:pointer;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#bbb;transition:all .3s ease;font-family:inherit;touch-action:manipulation}
.media-tabs button:hover{background:rgba(255,255,255,.08);color:#fff}
.media-tabs button.active{background:var(--accent-soft);border-color:var(--accent);color:#fff}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:11px}
.media-card{position:relative;border-radius:var(--r-md);overflow:hidden;cursor:pointer;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);transition:all .4s cubic-bezier(.34,1.56,.64,1);aspect-ratio:4/3}
.media-card.audio{aspect-ratio:auto;padding:14px;display:flex;gap:12px;align-items:center}
.media-card:hover{transform:translateY(-4px) scale(1.02);border-color:var(--accent);box-shadow:0 16px 40px rgba(0,0,0,.5), 0 0 30px var(--accent-soft)}
.media-card img{width:100%;height:100%;object-fit:cover;display:block}
.media-card video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.media-card .badge{position:absolute;top:8px;right:8px;padding:3px 9px;border-radius:var(--r-pill);font-size:10px;font-weight:800;letter-spacing:.06em;background:rgba(0,0,0,.72);color:#fff;border:1px solid rgba(255,255,255,.1)}
.media-card .cap{position:absolute;left:0;right:0;bottom:0;padding:8px 11px;font-size:10.5px;font-weight:700;color:#fff;background:linear-gradient(transparent, rgba(0,0,0,.85));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media-card.audio .cap{position:static;background:none;padding:0;color:#eee;font-size:12px;flex:1;white-space:normal}
.media-card.audio .audio-icon{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.media-empty{color:#666;font-size:12px;padding:40px;text-align:center;grid-column:1/-1}

.media-view{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.95);backdrop-filter:blur(20px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:14px;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.media-view img,.media-view video{max-width:90%;max-height:70%;border-radius:var(--r-md);border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 80px rgba(0,0,0,.8)}
.media-view audio{width:80%;max-width:500px}
.media-view .cap{color:#ddd;font-size:13px;font-weight:700;text-align:center;word-break:break-word}
.media-view .nav{display:flex;gap:10px}
.media-view button{padding:9px 20px;border-radius:var(--r-pill);cursor:pointer;font-weight:800;font-size:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;transition:all .3s ease;touch-action:manipulation}
.media-view button:hover{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;transform:scale(1.05)}

/* Блокнот */
.notes{display:flex;flex-direction:column;height:100%}
.notes-toolbar{display:flex;gap:7px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.06);flex-wrap:wrap;align-items:center}
.notes-toolbar button{height:32px;padding:0 13px;border-radius:var(--r-pill);cursor:pointer;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#ccc;font-size:11.5px;font-weight:700;transition:all .3s ease;touch-action:manipulation}
.notes-toolbar button:hover{background:rgba(255,255,255,.08);color:#fff;transform:translateY(-2px)}
.notes-toolbar button.save{background:linear-gradient(135deg,color-mix(in srgb, var(--accent) 70%, #000),var(--accent));color:#fff;border-color:var(--accent)}
.notes-toolbar .status{margin-left:auto;font-size:10.5px;color:#666;font-weight:700}
.notes textarea{flex:1;width:100%;background:transparent;border:none;outline:none;resize:none;padding:16px 18px;color:#eaeaea;font-size:13px;line-height:1.7;font-family:ui-monospace,Menlo,monospace}
.notes-list{padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;gap:6px;flex-wrap:wrap}
.notes-list button{padding:5px 13px;border-radius:var(--r-pill);cursor:pointer;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#bbb;transition:all .25s ease;touch-action:manipulation}
.notes-list button:hover{background:rgba(255,255,255,.08);color:#fff}
.notes-list button.active{background:var(--accent-soft);border-color:var(--accent);color:#fff}

/* Paint */
.paint{display:flex;flex-direction:column;height:100%;background:rgba(0,0,0,.2)}
.paint-toolbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.06);flex-wrap:wrap;background:rgba(255,255,255,.02)}
.paint-toolbar .grp{display:flex;gap:5px;padding-right:10px;border-right:1px solid rgba(255,255,255,.07)}
.paint-toolbar .grp:last-child{border-right:none;padding-right:0}
.paint-toolbar button{height:34px;min-width:34px;padding:0 10px;border-radius:12px;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#ccc;font-size:14px;font-weight:700;transition:all .25s cubic-bezier(.34,1.56,.64,1);display:inline-flex;align-items:center;justify-content:center;touch-action:manipulation}
.paint-toolbar button:hover{background:rgba(255,255,255,.1);color:#fff;transform:translateY(-2px)}
.paint-toolbar button.active{background:var(--accent-soft);border-color:var(--accent);color:#fff}
.paint-toolbar input[type="color"]{width:36px;height:34px;padding:2px;border-radius:10px;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.paint-toolbar input[type="range"]{width:90px;accent-color:var(--accent)}
.paint-canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto;position:relative;touch-action:none}
.paint-canvas-wrap canvas{background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.6);cursor:crosshair;touch-action:none;max-width:100%}
.paint-status{font-size:10.5px;color:#888;padding:6px 14px;border-top:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;font-family:ui-monospace,monospace}

/* Игры */
.games-hub{padding:20px;overflow:auto;height:100%}
.games-hub h3{margin:0 0 16px;font-size:13px;color:#aaa;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.gcard{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:18px 16px;cursor:pointer;transition:all .4s cubic-bezier(.34,1.56,.64,1);text-align:left;touch-action:manipulation}
.gcard:hover{transform:translateY(-4px) scale(1.02);border-color:var(--accent);background:rgba(255,255,255,.06);box-shadow:0 15px 40px rgba(0,0,0,.5), 0 0 30px var(--accent-soft)}
.gcard .gc-ico{width:44px;height:44px;border-radius:12px;margin-bottom:12px;background:var(--accent-soft);border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px}
.gcard .gc-ico .ico{width:26px;height:26px}
.gcard .gc-title{font-size:15px;font-weight:800;color:#fff;margin-bottom:4px}
.gcard .gc-desc{font-size:11.5px;color:#888;line-height:1.5}

.game-wrap{display:flex;flex-direction:column;height:100%;background:rgba(0,0,0,.35);align-items:center;justify-content:center;padding:16px;position:relative;touch-action:none}
.game-wrap canvas{background:#0a0a0c;border-radius:14px;border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 60px rgba(0,0,0,.7), inset 0 0 40px rgba(225,6,0,.05);max-width:100%;max-height:100%;touch-action:none}
.game-hud{display:flex;align-items:center;justify-content:space-between;width:100%;padding:8px 4px;font-size:12px;color:#ccc;font-family:ui-monospace,monospace;max-width:100%}
.game-hud .score{color:var(--accent-2);font-weight:800;font-size:14px}
.game-hud button{padding:6px 14px;border-radius:var(--r-pill);cursor:pointer;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#ddd;transition:all .3s ease;touch-action:manipulation}
.game-hud button:hover{background:rgba(255,255,255,.1);color:#fff;transform:translateY(-2px)}
.game-overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:5;flex-direction:column;gap:16px;border-radius:14px}
.game-overlay.on{display:flex}
.game-overlay h4{font-size:32px;margin:0;color:#fff;font-family:Georgia,serif;font-style:italic;letter-spacing:-.03em}
.game-overlay p{margin:0;color:#bbb;font-size:13px}
.game-overlay button{padding:10px 24px;border-radius:var(--r-pill);cursor:pointer;font-size:13px;font-weight:800;background:linear-gradient(135deg,color-mix(in srgb, var(--accent) 70%, #000),var(--accent));border:1px solid var(--accent);color:#fff;transition:all .3s ease;touch-action:manipulation}
.game-overlay button:hover{transform:scale(1.05);box-shadow:0 10px 30px var(--accent-glow)}
.game-help{font-size:10.5px;color:#666;margin-top:8px;font-family:ui-monospace,monospace;letter-spacing:.04em}
.game-help kbd{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:5px;padding:1px 6px;color:#bbb;margin:0 2px}

.touch-controls{display:none;width:100%;max-width:400px;margin-top:10px;justify-content:space-between;align-items:center;user-select:none;-webkit-user-select:none}
.touch-controls .dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px}
.touch-controls .dpad button,
.touch-controls .action-btn{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#ddd;border-radius:14px;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;transition:background .15s, transform .1s}
.touch-controls .dpad button:active,
.touch-controls .action-btn:active{background:var(--accent-soft);border-color:var(--accent);transform:scale(.92)}
.touch-controls .dpad .empty{visibility:hidden;pointer-events:none}
.touch-controls .actions{display:flex;flex-direction:column;gap:8px}
.touch-controls .action-btn{width:64px;height:64px;border-radius:50%;font-size:14px}

@media (pointer: coarse){
  .touch-controls{display:flex}
  .game-help kbd{display:none}
  .game-help::after{content:'Управление — на экранных кнопках';font-size:10px;color:#666}
}
@media (pointer: coarse){
  .dock-app{width:44px;height:44px;flex:0 0 44px;border-radius:14px}
  .dock-app .ico{width:26px;height:26px}
  .tb-btn{min-height:44px;min-width:44px}
  .tb-btn.icon-only{width:44px;height:44px}
  .win-dots i{width:18px;height:18px}
  .win-dots{gap:14px}
  .fm-toolbar button{min-height:40px}
  .calc-keys button{min-height:56px}
  .set-btn{min-height:40px}
  .set-select{min-height:40px}
  .media-tabs button{min-height:38px}
  .notes-toolbar button{min-height:40px}
  .notes-list button{min-height:36px}
  .paint-toolbar button{min-height:42px;min-width:42px}
  .sm-app{min-height:52px}
  .sm-foot .sm-btn{min-height:40px}
  .welcome-foot button{min-height:44px}
  .fm-file{padding:14px 8px}
  .media-card.audio{padding:16px}
  .game-hud button{min-height:40px;padding:8px 18px}
}

/* Настройки */
.settings{padding:18px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.set-group{border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:14px 16px;background:rgba(255,255,255,.02)}
.set-group h4{margin:0 0 10px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:#888;font-weight:800}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid rgba(255,255,255,.05);flex-wrap:wrap}
.set-row:first-of-type{border-top:none}
.set-row label{font-size:12.5px;color:#ccc;font-weight:600}
.set-row .hint{font-size:10.5px;color:#777;margin-top:2px}
.set-row .color-picker{display:flex;gap:6px;align-items:center}
.set-row .color-picker input[type="color"]{width:38px;height:30px;padding:2px;border-radius:9px;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.switch{width:48px;height:26px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);cursor:pointer;position:relative;transition:all .3s ease;flex-shrink:0}
.switch i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:all .3s cubic-bezier(.34,1.56,.64,1)}
.switch.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent}
.switch.on i{left:25px}
.set-btn{padding:8px 15px;border-radius:var(--r-pill);cursor:pointer;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#ddd;transition:all .3s ease;touch-action:manipulation}
.set-btn:hover{background:rgba(255,255,255,.1);color:#fff;transform:translateY(-2px)}
.set-btn.danger{color:#ff6b6b;border-color:rgba(255,80,80,.3)}
.set-btn.danger:hover{background:var(--accent-soft);color:#fff}
.set-select{padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#ddd;outline:none;font-size:12px;cursor:pointer}
.set-select option{background:#1a1a1c;color:#eee}
.uid-badge{font-family:ui-monospace,monospace;font-size:10.5px;color:#666;background:rgba(0,0,0,.3);padding:4px 10px;border-radius:var(--r-pill);border:1px solid rgba(255,255,255,.06)}

.bg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:6px}
.bg-pick{position:relative;aspect-ratio:16/10;border-radius:14px;overflow:hidden;cursor:pointer;border:2px solid rgba(255,255,255,.08);transition:all .3s cubic-bezier(.34,1.56,.64,1);background:#111;touch-action:manipulation}
.bg-pick:hover{transform:translateY(-3px) scale(1.03);border-color:rgba(255,255,255,.22)}
.bg-pick.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft), 0 0 20px var(--accent-soft)}
.bg-pick canvas,.bg-pick img{width:100%;height:100%;display:block;object-fit:cover}
.bg-pick .label{position:absolute;left:0;right:0;bottom:0;padding:5px 9px;font-size:10.5px;font-weight:800;color:#fff;background:linear-gradient(transparent, rgba(0,0,0,.85));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}

.about-body{padding:30px 46px 26px;overflow:auto;height:100%}
.about-logo{text-align:center;margin-bottom:34px}
.about-logo .name{font-size:84px;font-weight:700;letter-spacing:-.06em;color:#fff;line-height:1;font-family:Georgia,'Times New Roman',serif;font-style:italic}
.about-logo .ver{font-size:12.5px;color:#888;letter-spacing:.32em;font-weight:700;text-transform:uppercase;margin-top:10px}
.about-card{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);border-radius:22px;padding:22px 26px}
.about-card .card-title{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#888;font-weight:800;margin-bottom:12px}
.about-line{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-top:1px solid rgba(255,255,255,.05);gap:14px}
.about-line:first-of-type{border-top:none}
.about-line .lbl{color:#e0e0e0;font-weight:700;font-size:13.5px}
.about-line .val{color:#aaa;font-weight:600;font-size:12.5px;font-family:ui-monospace,Menlo,monospace;text-align:right;word-break:break-word}

/* === НОВЫЙ ABOUT: 3 колонки, адаптив по ширине окна === */
.about-pc{
  display:grid;
  grid-template-columns: 1fr 1fr 1.15fr;
  gap:22px;
  padding:26px 30px;
  height:100%;
  overflow:auto;
  align-items:start;
  transition:grid-template-columns .25s ease;
}

}

}

@media (max-width:760px){

.about-card{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:16px 18px}
.about-card .card-title{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:#888;font-weight:800;margin-bottom:8px}
.about-line{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid rgba(255,255,255,.05);gap:14px}
.about-line:first-of-type{border-top:none}
.about-line .lbl{color:#e0e0e0;font-weight:700;font-size:12.5px}
.about-line .val{color:#aaa;font-weight:600;font-size:11.5px;font-family:ui-monospace,Menlo,monospace;text-align:right}

.welcome-body{padding:40px 46px 34px;overflow:auto;height:100%}
.welcome-logo{text-align:center;margin-bottom:26px}
.welcome-logo .name{font-size:96px;font-weight:700;letter-spacing:-.06em;color:#fff;line-height:1;font-family:Georgia,'Times New Roman',serif;font-style:italic}
.welcome-logo .ver{font-size:13px;color:#888;letter-spacing:.32em;font-weight:700;text-transform:uppercase;margin-top:12px}
.welcome-lead{text-align:center;color:#bbb;font-size:14px;max-width:520px;margin:0 auto 30px;line-height:1.6}
.welcome-lead b{color:var(--accent-2);font-weight:800}
.welcome-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.welcome-card{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:16px 18px;transition:all .35s cubic-bezier(.34,1.56,.64,1)}
.welcome-card:hover{background:rgba(255,255,255,.06);border-color:var(--accent);transform:translateY(-3px)}
.welcome-card .wc-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.welcome-card .wc-ico{width:32px;height:32px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);border:1px solid var(--accent);color:#fff}
.welcome-card .wc-ico .ico{width:18px;height:18px}
.welcome-card .wc-title{font-weight:800;font-size:13.5px;color:#fff}
.welcome-card .wc-desc{color:#999;font-size:12px;line-height:1.55}
.welcome-card kbd{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:1px 6px;font-size:10.5px;font-family:ui-monospace,monospace;color:#ddd;margin:0 1px}
.welcome-foot{display:flex;justify-content:center;gap:10px;margin-top:26px;flex-wrap:wrap}
.welcome-foot button{padding:10px 22px;border-radius:var(--r-pill);cursor:pointer;font-size:12.5px;font-weight:800;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#ddd;transition:all .3s cubic-bezier(.34,1.56,.64,1);touch-action:manipulation}
.welcome-foot button:hover{background:rgba(255,255,255,.1);color:#fff;transform:translateY(-2px)}
.welcome-foot button.primary{background:linear-gradient(135deg,color-mix(in srgb, var(--accent) 70%, #000),var(--accent));border-color:var(--accent);color:#fff}
.welcome-foot button.primary:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 10px 30px var(--accent-glow)}

#ctx{position:fixed;z-index:9997;min-width:180px;padding:6px;border-radius:14px;background:rgba(15,15,17,.96);border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 60px rgba(0,0,0,.7);display:none;backdrop-filter:blur(20px)}
#ctx.on{display:block;animation:ctxIn .18s ease}
@keyframes ctxIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
#ctx button{width:100%;text-align:left;padding:8px 13px;border-radius:10px;cursor:pointer;background:transparent;border:none;color:#ddd;font-size:12.5px;display:flex;align-items:center;gap:9px;transition:all .2s ease;font-family:inherit;touch-action:manipulation}
#ctx button:hover{background:rgba(255,255,255,.08);color:#fff}
#ctx button.danger:hover{background:var(--accent-soft);color:#fff}
#ctx .sep{height:1px;background:rgba(255,255,255,.07);margin:5px 8px}

#taskview{position:fixed;inset:0;z-index:9990;background:rgba(0,0,0,.85);backdrop-filter:blur(30px);display:none;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap;padding:60px}
#taskview.on{display:flex;animation:fadeIn .3s ease}
#taskview .tv{width:220px;height:160px;border-radius:var(--r-md);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:all .4s cubic-bezier(.34,1.56,.64,1);padding:16px;text-align:center;touch-action:manipulation}
#taskview .tv:hover{transform:scale(1.06);border-color:var(--accent);box-shadow:0 0 50px var(--accent-soft)}
#taskview .tv .ic{display:flex;align-items:center;justify-content:center;width:42px;height:42px;color:#fff}
#taskview .tv .ic .ico{width:42px;height:42px}
#taskview .tv .nm{font-size:12.5px;font-weight:800;color:#ddd}

#toasts{position:fixed;top:76px;right:18px;z-index:9998;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{min-width:220px;max-width:340px;padding:11px 15px;border-radius:16px;background:rgba(15,15,17,.94);border:1px solid rgba(255,255,255,.1);box-shadow:0 16px 50px rgba(0,0,0,.6);color:#eee;font-size:12.5px;display:flex;align-items:center;gap:10px;pointer-events:auto;animation:toastIn .45s cubic-bezier(.34,1.56,.64,1)}
.toast.out{animation:toastOut .35s ease forwards}
.toast .ic{font-size:17px}
.toast b{color:#fff;font-weight:800}
.toast small{display:block;color:#888;font-size:10.5px;margin-top:2px}
@keyframes toastIn{from{opacity:0;transform:translateX(60px) scale(.9)}to{opacity:1;transform:translateX(0) scale(1)}}
@keyframes toastOut{to{opacity:0;transform:translateX(60px) scale(.9)}}

#boot{position:fixed;inset:0;z-index:9999;background:#070707;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .7s ease, visibility .7s ease}
#boot.hide{opacity:0;visibility:hidden}
#boot .logo{font-size:46px;font-weight:700;letter-spacing:-.06em;color:#fff;font-family:Georgia,'Times New Roman',serif;font-style:italic}
#boot .logo i{color:var(--accent);font-style:italic}
#boot .bar{width:240px;height:4px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
#boot .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2),#fff);animation:bootLoad 2.2s ease-in-out forwards}
@keyframes bootLoad{0%{width:0}60%{width:80%}100%{width:100%}}
#boot small{color:#666;font-size:12px;letter-spacing:.22em;text-transform:uppercase}

#calendarPopup{position:fixed;z-index:9996;width:300px;padding:16px;background:rgba(14,14,16,.96);backdrop-filter:blur(34px) saturate(1.4);border:1px solid rgba(255,255,255,.1);border-radius:var(--r-startmenu);box-shadow:0 30px 90px rgba(0,0,0,.75);display:none}
#calendarPopup.on{display:block;animation:calIn .25s ease}
@keyframes calIn{from{opacity:0;transform:scale(.95) translateY(-8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-header .cal-month{font-size:15px;font-weight:800;color:#fff;letter-spacing:-.02em}
.cal-header .cal-nav{display:flex;gap:4px}
.cal-header .cal-nav button{width:28px;height:28px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#ccc;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .2s ease}
.cal-header .cal-nav button:hover{background:rgba(255,255,255,.1);color:#fff}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-grid .cal-dow{font-size:10px;color:#666;font-weight:800;padding:4px 0;text-transform:uppercase}
.cal-grid .cal-day{height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12.5px;color:#ccc;cursor:default;font-weight:600;transition:all .2s ease}
.cal-grid .cal-day.other{color:#555}
.cal-grid .cal-day.today{background:var(--accent);color:#fff;font-weight:800;box-shadow:0 0 16px var(--accent-glow)}
.cal-grid .cal-day.weekend{color:#ff7b7b}
.cal-grid .cal-day.weekend.today{color:#fff}
.cal-grid .cal-day:not(.today):hover{background:rgba(255,255,255,.06)}

.regedit-body{padding:18px;overflow:auto;height:100%;display:flex;flex-direction:column;gap:14px}
.regedit-group{border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:14px 16px;background:rgba(255,255,255,.02)}
.regedit-group h4{margin:0 0 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#888;font-weight:800}
.regedit-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid rgba(255,255,255,.05);flex-wrap:wrap}
.regedit-row:first-of-type{border-top:none}
.regedit-row label{font-size:12.5px;color:#ccc;font-weight:600;min-width:140px}
.regedit-row input[type="color"]{width:38px;height:30px;padding:2px;border-radius:9px;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.regedit-row input[type="range"]{width:140px;accent-color:var(--accent)}
.regedit-row select,.regedit-row input[type="text"]{padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#ddd;outline:none;font-size:12px}
.regedit-row select option{background:#1a1a1c;color:#eee}
.regedit-row .val-preview{font-family:ui-monospace,monospace;font-size:11px;color:#888;min-width:50px;text-align:right}

@media (max-width:900px){
  .tb-logo .os-tag{display:none}
  .tb-btn .tb-txt{display:none}
  .win{min-width:0}

  :root{--topbar-h:56px;--bottombar-h:52px}

  .tb-logo .mark{font-size:16px}
  .dock-app{width:36px;height:36px;border-radius:10px}
  .win{left:6px !important;top:6px !important;width:calc(100% - 12px) !important;height:calc(100% - 12px) !important;border-radius:18px}
  .win.max{border-radius:0}

  .welcome-logo .name{font-size:52px}
  .welcome-body{padding:22px 14px}
  #calendarPopup{width:calc(100vw - 20px);left:10px !important}
  .tb-dock{max-width:calc(100% - 200px)}
}

  const m = hex.replace('#','');
  const full = m.length===3 ? m.split('').map(c=>c+c).join('') : m;

  const [r,g,b] = hexToRgb(hex);

      else if(id==='pulse'){ const cx = w/2, cy = h/2; for(let i=0;i<3;i++){ const r = 20 + i*30; c.strokeStyle = `rgba(${ar},${ag},${ab},${0.3 - i*0.08})`; c.lineWidth = 1.5; c.beginPath(); c.arc(cx,cy,r,0,Math.PI*2); c.stroke(); } }
      else if(id==='lightning'){ c.strokeStyle = `rgba(${ar},${ag},${ab},0.8)`; c.lineWidth = 2; c.beginPath(); let x = w/2, y = 0; c.moveTo(x,y); while(y < h){ x += (Math.random()-0.5)*20; y += 15; c.lineTo(x,y); } c.stroke(); }

      else if(id==='vortex'){ const cx = w/2, cy = h/2; for(let i=0;i<60;i++){ const angle = Math.random()*Math.PI*2; const r = Math.random()*Math.max(w,h)*0.5; const x = cx + Math.cos(angle)*r; const y = cy + Math.sin(angle)*r; c.beginPath(); c.arc(x,y,1.5,0,Math.PI*2); c.fillStyle = `rgba(${ar},${ag},${ab},${0.7 - r/(w)})`; c.fill(); } }

function applyDockPosition(){
  const body = document.body;
  if(!body) return;
  body.classList.remove('dock-split','dock-bottom','dock-hidden');
  const pos = Settings.data.dockPosition;
  if(pos==='hidden')      body.classList.add('dock-hidden');
  else if(pos==='split')  body.classList.add('dock-split');
  else if(pos==='bottom') body.classList.add('dock-bottom');
  if(Dock) Dock.render();
  if(StartMenu) StartMenu.position();
}

FS = {
  root: null,
  load(){ try{ const raw = localStorage.getItem(PKEY('fs')); if(raw){ this.root = JSON.parse(raw); return; } }catch(e){} this.root = this.seed(); this.save(); },
  save(){ try{ localStorage.setItem(PKEY('fs'), JSON.stringify(this.root)); }catch(e){} },
  seed(){
    const now = Date.now();
    const f = (name, content, ext) => ({ id:uid(), name, type:'file', ext:ext||name.split('.').pop().toLowerCase(), content:content||'', size:(content||'').length, mtime:now });
    const d = (name, children) => ({ id:uid(), name, type:'folder', children:children||[], mtime:now });
    return d('/', [
      d('Документы', [ f('добро_пожаловать.txt', 'Добро пожаловать в Mict OS 1.4!', 'txt') ]),
      d('Музыка', []), d('Фото', []), d('Видео', []),
      d('Рисунки', []), d('Проекты', []), d('Корзина', [])
    ]);
  },
  find(path){
    if(!path || path==='/') return this.root;
    const parts = path.split('/').filter(Boolean);
    let cur = this.root;
    for(const p of parts){ if(cur.type!=='folder') return null; const next = cur.children.find(c => c.name === p); if(!next) return null; cur = next; }
    return cur;
  },
  resolvePath(cwd, input){
    if(!input) return cwd;
    let p = String(input).replace(/\\/g,'/');
    const isAbs = p.startsWith('/');
    const base = isAbs ? [] : cwd.split('/').filter(Boolean);
    const parts = p.split('/').filter(Boolean);
    for(const part of parts){ if(part==='.') continue; if(part==='..'){ base.pop(); continue; } base.push(part); }
    return '/' + base.join('/');
  },
  parent(path){ const parts = path.split('/').filter(Boolean); parts.pop(); return '/' + parts.join('/'); },
  name(path){ return path.split('/').filter(Boolean).pop() || ''; },
  uniqueName(dir, base){
    if(!dir.children.some(c=>c.name===base)) return base;
    const dot = base.lastIndexOf('.');
    const stem = dot>0 ? base.slice(0,dot) : base;
    const ext = dot>0 ? base.slice(dot) : '';
    let i = 2;
    while(dir.children.some(c=>c.name === stem+' ('+i+')'+ext)) i++;
    return stem+' ('+i+')'+ext;
  },
  mkdir(path, name){
    const dir = this.find(path);
    if(!dir || dir.type!=='folder') return {ok:false, err:'Папка не найдена'};
    const nm = this.uniqueName(dir, name);
    dir.children.push({ id:uid(), name:nm, type:'folder', children:[], mtime:Date.now() });
    this.save(); return {ok:true, name:nm};
  },
  write(path, content){
    const dir = this.find(this.parent(path));
    const name = this.name(path);
    if(!dir || dir.type!=='folder') return {ok:false, err:'Путь не найден'};
    let file = dir.children.find(c=>c.name===name);
    if(file){ if(file.type!=='file') return {ok:false, err:'Это папка'}; file.content = content; file.size = content.length; file.mtime = Date.now(); }
    else { dir.children.push({ id:uid(), name, type:'file', ext:name.split('.').pop().toLowerCase(), content, size:content.length, mtime:Date.now() }); }
    this.save(); return {ok:true};
  },
  touch(path){ const r = this.find(path); if(r) return {ok:true, exists:true}; return this.write(path, ''); },
  read(path){
    const f = this.find(path);
    if(!f) return {ok:false, err:'Файл не найден'};
    if(f.type!=='file') return {ok:false, err:'Это папка'};
    return {ok:true, content:f.content};
  },
  rm(path, toTrash=true){
    const parentPath = this.parent(path);
    const parent = this.find(parentPath);
    const name = this.name(path);
    if(!parent || parent.type!=='folder') return {ok:false, err:'Путь не найден'};
    const idx = parent.children.findIndex(c=>c.name===name);
    if(idx<0) return {ok:false, err:'Не найдено'};
    const [removed] = parent.children.splice(idx,1);
    if(toTrash && parentPath !== '/Корзина'){ const trash = this.find('/Корзина'); if(trash && trash.type==='folder') trash.children.push({...removed, _from:parentPath, _deleted:Date.now()}); }
    this.save(); return {ok:true};
  },
  cp(from, to, move=false){
    const src = this.find(from);
    if(!src) return {ok:false, err:'Источник не найден'};
    const dstNode = this.find(to);
    let targetPath = to;
    if(dstNode && dstNode.type==='folder') targetPath = (to==='/'?'':to) + '/' + src.name;
    const targetParent = this.find(this.parent(targetPath));
    if(!targetParent) return {ok:false, err:'Целевая папка не найдена'};
    if(src.type==='folder' && (targetPath === from || targetPath.startsWith(from + '/'))) return {ok:false, err:'Нельзя вложить папку в себя'};
    const clone = JSON.parse(JSON.stringify(src));
    clone.id = uid(); clone.mtime = Date.now();
    clone.name = this.uniqueName(targetParent, src.name);
    targetParent.children.push(clone);
    if(move) this.rm(from, false);
    this.save(); return {ok:true};
  },
  mv(from, to){
    const dstNode = this.find(to);
    if(dstNode && dstNode.type==='folder'){ const srcName = this.name(from); return this.cp(from, (to==='/'?'':to) + '/' + srcName, true); }
    return this.cp(from, to, true);
  },
  rename(path, newName){
    const parent = this.find(this.parent(path));
    if(!parent) return {ok:false, err:'Путь не найден'};
    const node = parent.children.find(c=>c.name===this.name(path));
    if(!node) return {ok:false, err:'Не найдено'};
    const safe = this.uniqueName(parent, newName);
    node.name = safe;
    if(node.type==='file') node.ext = safe.split('.').pop().toLowerCase();
    node.mtime = Date.now();
    this.save(); return {ok:true, name:safe};
  },
  list(path){
    const d = this.find(path);
    if(!d || d.type!=='folder') return [];
    return [...d.children].sort((a,b)=>{ if(a.type!==b.type) return a.type==='folder'?-1:1; return a.name.localeCompare(b.name,'ru'); });
  },
  tree(path='/', prefix=''){
    const d = this.find(path);
    if(!d || d.type!=='folder') return '';
    let out = '';
    const items = this.list(path);
    items.forEach((c,i)=>{ const last = i===items.length-1; out += prefix + (last?'└── ':'├── ') + c.name + (c.type==='folder'?'/':'') + '\n'; if(c.type==='folder') out += this.tree(path + (path==='/'?'':'/') + c.name, prefix + (last?'    ':'│   ')); });
    return out;
  },
  search(query, path='/'){
    const results = [];
    const walk = (p) => { const d = this.find(p); if(!d || d.type!=='folder') return; for(const c of d.children){ const full = p + (p==='/'?'':'/') + c.name; if(c.name.toLowerCase().includes(query.toLowerCase())) results.push({path:full, type:c.type}); if(c.type==='folder') walk(full); } };
    walk(path); return results;
  },
  du(path='/'){
    let files=0, folders=0, bytes=0;
    const walk = (p) => { const d = this.find(p); if(!d || d.type!=='folder') return; for(const c of d.children){ if(c.type==='folder'){ folders++; walk(p + (p==='/'?'':'/') + c.name); } else { files++; bytes += c.size||0; } } };
    walk(path); return {files, folders, bytes};
  }
};

WM = {
  wins: [], z: 10, workspace: null, snapZone: null, snapHintEl: null, allMinimized: false,

    this._build(win);

        {t: win.maximized?'Восстановить':'Развернуть', i:'▢', fn:()=>this.toggleMax(win)},
        {t:'Прикрепить влево', i:'◧', fn:()=>this.snap(win,'left')},
        {t:'Прикрепить вправо', i:'◨', fn:()=>this.snap(win,'right')},
        {t:'Восстановить позицию', i:'⤢', fn:()=>{ win.x = 80; win.y = 90; win.w = APP_DEFS[win.app]?.w || win.w; win.h = APP_DEFS[win.app]?.h || win.h; win.el.style.left = win.x+'px'; win.el.style.top = win.y+'px'; win.el.style.width = win.w+'px'; win.el.style.height = win.h+'px'; win.maximized = false; win.el.classList.remove('max'); }},
        {sep:true},
        {t:'Закрыть окно', i:'✕', danger:true, fn:()=>this.close(win)}
      ]);
    });

    const head = el.querySelector('.win-head');
    let drag = null;
    const onPointerMove = (e)=>{
      if(!drag || e.pointerId !== drag.pointerId) return;
      e.preventDefault();
      const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
      if(!drag.moved){ if(Math.abs(dx) > 3 || Math.abs(dy) > 3){ drag.moved = true; el.classList.add('no-anim'); el.style.animation = 'none'; } else return; }
      win.x = drag.ox + dx;
      win.y = Math.max(0, drag.oy + dy);
      el.style.left = win.x + 'px'; el.style.top = win.y + 'px';
      const MARGIN = 20, TOP = 10;
      let zone = null;
      if(e.clientY <= TOP) zone = 'max';
      else if(e.clientX <= MARGIN) zone = 'left';
      else if(e.clientX >= window.innerWidth - MARGIN) zone = 'right';
      if(zone !== this.snapZone){ this.snapZone = zone; this.showSnapHint(zone); }
    };
    const onPointerUp = (e)=>{
      if(!drag || e.pointerId !== drag.pointerId) return;
      head.releasePointerCapture?.(drag.pointerId);
      head.removeEventListener('pointermove', onPointerMove);
      head.removeEventListener('pointerup', onPointerUp);
      head.removeEventListener('pointercancel', onPointerUp);
      if(drag.moved && this.snapZone) this.snap(win, this.snapZone);
      drag = null; this.snapZone = null; this.hideSnapHint();

        win.y = Math.max(0, e.clientY - 28);
        win.el.style.left = win.x + 'px'; win.el.style.top = win.y + 'px';
      }
      drag = { pointerId: e.pointerId, sx:e.clientX, sy:e.clientY, ox:win.x, oy:win.y, moved:false };
      head.setPointerCapture?.(e.pointerId);
      head.addEventListener('pointermove', onPointerMove);
      head.addEventListener('pointerup', onPointerUp);
      head.addEventListener('pointercancel', onPointerUp);
      e.preventDefault();
    });

    el.querySelectorAll('.win-resize').forEach(handle=>{
      const dir = handle.dataset.dir;
      let rs = null;
      const onRszMove = (e)=>{
        if(!rs || e.pointerId !== rs.pointerId) return;
        e.preventDefault();
        const dx = e.clientX - rs.sx, dy = e.clientY - rs.sy;
        let nx = rs.ox, ny = rs.oy, nw = rs.ow, nh = rs.oh;
        const MIN_W = 280, MIN_H = 160;
        if(dir.includes('e')) nw = Math.max(MIN_W, rs.ow + dx);
        if(dir.includes('s')) nh = Math.max(MIN_H, rs.oh + dy);
        if(dir.includes('w')){ nw = Math.max(MIN_W, rs.ow - dx); nx = rs.ox + (rs.ow - nw); }
        if(dir.includes('n')){ nh = Math.max(MIN_H, rs.oh - dy); ny = rs.oy + (rs.oh - nh); }
        win.x = nx; win.y = Math.max(0, ny); win.w = nw; win.h = nh;
        el.style.left = win.x + 'px'; el.style.top = win.y + 'px';
        el.style.width = win.w + 'px'; el.style.height = win.h + 'px';
      };
      const onRszUp = (e)=>{
        if(!rs || e.pointerId !== rs.pointerId) return;
        handle.releasePointerCapture?.(e.pointerId);
        handle.removeEventListener('pointermove', onRszMove);
        handle.removeEventListener('pointerup', onRszUp);
        handle.removeEventListener('pointercancel', onRszUp);
        rs = null;
      };
      handle.addEventListener('pointerdown', (e)=>{
        if(e.button !== undefined && e.button !== 0) return;
        e.stopPropagation();
        if(win.maximized) return;
        rs = { pointerId: e.pointerId, sx: e.clientX, sy: e.clientY, ox: win.x, oy: win.y, ow: win.w, oh: win.h };
        handle.setPointerCapture?.(e.pointerId);
        handle.addEventListener('pointermove', onRszMove);
        handle.addEventListener('pointerup', onRszUp);
        handle.addEventListener('pointercancel', onRszUp);
        e.preventDefault();
      });
    });

    el.addEventListener('pointerdown', ()=>this.focus(win));
    el.style.overflow = 'hidden';
  },
  showSnapHint(zone){
    const hint = this.snapHintEl;
    if(!hint) return;
    if(!zone){ hint.classList.remove('on'); return; }
    const rect = this._snapRect(zone);
    hint.style.left = rect.left + 'px'; hint.style.top = rect.top + 'px';
    hint.style.width = rect.width + 'px'; hint.style.height = rect.height + 'px';
    hint.classList.add('on');
  },
  hideSnapHint(){ if(this.snapHintEl) this.snapHintEl.classList.remove('on'); },
  _snapRect(zone){
    const tbH = 64;
    const bdH = (document.body.classList.contains('dock-split')) ? 56 : 0;
    const W = window.innerWidth, H = window.innerHeight;
    let rect;
    if(zone==='left')       rect = { left:6, top:tbH+6, width:W/2 - 12, height:H - tbH - bdH - 12 };
    else if(zone==='right') rect = { left:W/2 + 6, top:tbH+6, width:W/2 - 12, height:H - tbH - bdH - 12 };
    else                    rect = { left:6, top:tbH+6, width:W - 12, height:H - tbH - bdH - 12 };
    return rect;
  },
  snap(win, zone){
    const rect = this._snapRect(zone);
    if(zone==='max'){
      win._prev = { x:win.x, y:win.y, w:win.w, h:win.h };
      win.maximized = true;
      win.el.classList.add('max');
      win.el.style.left = '0px'; win.el.style.top = '0px';
      win.el.style.width = '100%'; win.el.style.height = '100%';
    } else {
      win.maximized = false; win.el.classList.remove('max');
      win.x = rect.left; win.y = rect.top;
      win.w = rect.width; win.h = rect.height;
      win.el.style.left = rect.left + 'px'; win.el.style.top = rect.top + 'px';
      win.el.style.width = rect.width + 'px'; win.el.style.height = rect.height + 'px';
    }
  },
  focus(win){ if(win.closed) return; this.z++; win.el.style.zIndex = this.z; this.wins.forEach(w=>w.el.classList.toggle('focused', w===win)); if(Dock) Dock.markActive(win.app); },
  minimize(win){ if(win.minimized) return; win.minimized = true; win.el.classList.add('min'); if(Dock) Dock.markActive(win.app); },
  unminimize(win){ if(!win.minimized) return; win.minimized = false; win.el.classList.remove('min'); },
  toggleMax(win){
    if(win.maximized){ win.maximized = false; win.el.classList.remove('max'); const p = win._prev || { x:80, y:90, w:APP_DEFS[win.app]?.w||800, h:APP_DEFS[win.app]?.h||500 }; win.x = p.x; win.y = p.y; win.w = p.w; win.h = p.h; win.el.style.left = win.x+'px'; win.el.style.top = win.y+'px'; win.el.style.width = win.w+'px'; win.el.style.height = win.h+'px'; }
    else { win._prev = { x:win.x, y:win.y, w:win.w, h:win.h }; win.maximized = true; win.el.classList.add('max'); }
  },
  close(win){
    win.closed = true;
    win.el.style.animation = 'winOpen .25s reverse';
    setTimeout(()=>win.el.remove(), 230);
    this.wins = this.wins.filter(w=>w!==win);
    if(Dock) Dock.render();
    const top = [...this.wins].sort((a,b)=>(b.el.style.zIndex||0) - (a.el.style.zIndex||0))[0];
    if(Dock){ if(top) Dock.markActive(top.app); else Dock.markActive(null); }
  },
  minimizeAll(){ this.allMinimized = true; this.wins.forEach(w=>{ if(!w.minimized) this.minimize(w); }); },
  restoreAll(){ this.allMinimized = false; this.wins.forEach(w=>{ if(w.minimized) this.unminimize(w); }); },
  toggleAll(){ if(this.allMinimized) this.restoreAll(); else this.minimizeAll(); }
};

Dock = {
  el: null, elBottom: null, apps: [],
  init(){ this.el = $('#tbDock'); this.elBottom = $('#bottomDock'); },
  getVisibleApps(){
    const pinned = Settings.data.pinnedApps || [];
    const open = WM.wins.map(w=>w.app);
    const all = [...new Set([...pinned, ...open])];
    return all;
  },
  render(){
    const e = this.el, eb = this.elBottom;
    if(!e) return;
    this.apps = this.getVisibleApps();
    const split = document.body.classList.contains('dock-split');
    const hidden = document.body.classList.contains('dock-hidden');
    if(split || hidden){ e.style.display = 'none'; e.innerHTML = ''; }
    else { e.style.display = ''; e.innerHTML = this.apps.length ? this.apps.map(app=>this._iconHTML(app)).join('') : '<div class="placeholder">— ПРИЛОЖЕНИЯ ПОЯВЯТСЯ ЗДЕСЬ —</div>'; }
    if(eb){
      if(split){ eb.style.display = 'flex'; eb.innerHTML = this.apps.length ? this.apps.map(app=>this._iconHTML(app)).join('') : ''; }
      else { eb.style.display = 'none'; eb.innerHTML = ''; }
    }
    this._attach(e); this._attach(eb);
    this.markActive();
  },
  _iconHTML(app){
    const d = APP_DEFS[app];
    if(!d) return '';
    const flat = Settings.data.iconMode === 'flat';
    const inner = (flat && d.svgIcon) ? `<span class="ico">${SvgIcons[d.svgIcon]||SvgIcons.file}</span>` : `<span class="ico" style="font-size:19px">${d.icon}</span>`;
    return `<div class="dock-app" data-app="${app}" data-label="${esc(d.title)}">${inner}<span class="ind" style="display:none"></span></div>`;
  },
  _attach(container){
    if(!container) return;
    container.querySelectorAll('.dock-app').forEach(el=>{
      el.onclick = ()=>{
        const app = el.dataset.app;
        const w = WM.wins.find(w=>w.app===app);
        if(w){ if(w.minimized){ WM.unminimize(w); WM.focus(w); } else if(w.el.style.zIndex == WM.z){ WM.minimize(w); } else WM.focus(w); }
        else WM.open(app);
      };
      el.addEventListener('contextmenu', (e)=>{
        e.preventDefault();
        e.stopPropagation();
        const app = el.dataset.app;
        const isPinned = (Settings.data.pinnedApps || []).includes(app);
        showCtx(e.clientX, e.clientY, [
          {t: isPinned ? '📌 Убрать из дока' : '📌 Закрепить в доке', i:'', danger:isPinned,
           fn: ()=>{
             if(isPinned){ Settings.data.pinnedApps = Settings.data.pinnedApps.filter(a=>a!==app); toast('Убрано из дока', APP_DEFS[app]?.title || app); }
             else { Settings.data.pinnedApps.push(app); toast('Закреплено в доке', APP_DEFS[app]?.title || app); }
             Settings.save(); Dock.render();
           }},
          {sep:true},
          {t:'Открыть', i:'↗', fn:()=>{
            const w = WM.wins.find(x=>x.app===app);
            if(w){ if(w.minimized) WM.unminimize(w); WM.focus(w); }
            else WM.open(app);
          }},
          {t:'Свернуть все окна', i:'—', fn:()=>WM.toggleAll()}
        ]);
      });
      el.addEventListener('pointerdown', (e)=>{
        if(e.button !== undefined && e.button !== 0) return;
        const startX = e.clientX, startY = e.clientY;
        let dragging = false;
        let ghost = null;
        const pointerId = e.pointerId;
        try{ el.setPointerCapture(pointerId); }catch(_){}
        const onMove = (ev)=>{
          if(ev.pointerId !== pointerId) return;
          const dx = ev.clientX - startX, dy = ev.clientY - startY;
          if(!dragging && Math.hypot(dx,dy) > 14){
            dragging = true;
            ghost = document.createElement('div');
            ghost.style.cssText = 'position:fixed;pointer-events:none;z-index:99999;padding:6px 14px;border-radius:999px;background:rgba(15,15,17,.96);color:#fff;font-size:12px;font-weight:700;border:1px solid var(--accent);box-shadow:0 8px 24px rgba(0,0,0,.6);transform:translate(-50%,-50%);white-space:nowrap';
            ghost.textContent = 'Убрать из дока';
            document.body.appendChild(ghost);
            el.style.opacity = '0.4';
          }
          if(dragging && ghost){ ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px'; }
          if(dragging) ev.preventDefault();
        };
        const onUp = (ev)=>{
          if(ev.pointerId !== pointerId) return;
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
          document.removeEventListener('pointercancel', onUp);
          try{ el.releasePointerCapture(pointerId); }catch(_){}
          if(ghost){ ghost.remove(); ghost = null; }
          el.style.opacity = '';
          if(dragging){
            const app = el.dataset.app;
            const isPinned = (Settings.data.pinnedApps || []).includes(app);
            const rect = el.getBoundingClientRect();
            const dist = Math.hypot(ev.clientX - (rect.left+rect.width/2), ev.clientY - (rect.top+rect.height/2));
            if(dist > 60 && isPinned){
              Settings.data.pinnedApps = Settings.data.pinnedApps.filter(a=>a!==app);
              Settings.save(); Dock.render();
              toast('Убрано из дока', APP_DEFS[app]?.title || app);
            }
          }
        };
        document.addEventListener('pointermove', onMove, {passive:false});
        document.addEventListener('pointerup', onUp);
        document.addEventListener('pointercancel', onUp);
      });
    });
  },
  markActive(app){
    const update = (container)=>{
      if(!container) return;
      container.querySelectorAll('.dock-app').forEach(el=>{
        const a = el.dataset.app;
        const w = WM.wins.find(x=>x.app===a);
        el.classList.toggle('active', !!w && !w.minimized);
        const ind = el.querySelector('.ind');
        if(ind) ind.style.display = w ? 'block' : 'none';
      });
    };
    update(this.el); update(this.elBottom);
  }
};

function initStartMenuDrag(){
  const smApps = $('#smApps');
  if(!smApps) return;
  smApps.addEventListener('pointerdown', (e)=>{
    const appEl = e.target.closest('.sm-app');
    if(!appEl) return;
    if(e.button !== undefined && e.button !== 0) return;
    const app = appEl.dataset.app;
    if(!app || !APP_DEFS[app]) return;
    const startX = e.clientX, startY = e.clientY;
    let dragging = false;
    let ghost = null;
    const pointerId = e.pointerId;
    try{ appEl.setPointerCapture(pointerId); }catch(_){}
    const onMove = (ev)=>{
      if(ev.pointerId !== pointerId) return;
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      if(!dragging && Math.hypot(dx,dy) > 8){
        dragging = true;
        ghost = document.createElement('div');
        ghost.style.cssText = 'position:fixed;pointer-events:none;z-index:99999;padding:8px 16px;border-radius:999px;background:rgba(15,15,17,.96);color:#fff;font-size:12px;font-weight:700;border:1px solid var(--accent);box-shadow:0 8px 24px rgba(0,0,0,.6);transform:translate(-50%,-50%);white-space:nowrap';
        ghost.textContent = 'Закрепить в доке: ' + (APP_DEFS[app]?.title || app);
        document.body.appendChild(ghost);
        appEl.style.opacity = '0.5';
      }
      if(dragging && ghost){ ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px'; }
      if(dragging) ev.preventDefault();
    };
    const onUp = (ev)=>{
      if(ev.pointerId !== pointerId) return;
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      try{ appEl.releasePointerCapture(pointerId); }catch(_){}
      if(ghost){ ghost.remove(); ghost = null; }
      appEl.style.opacity = '';
      if(dragging){
        const dockRect = Dock.el?.getBoundingClientRect();
        const bottomRect = Dock.elBottom?.getBoundingClientRect();
        const inTop = dockRect && ev.clientY >= dockRect.top && ev.clientY <= dockRect.bottom && ev.clientX >= dockRect.left && ev.clientX <= dockRect.right;
        const inBottom = bottomRect && ev.clientY >= bottomRect.top && ev.clientY <= bottomRect.bottom && ev.clientX >= bottomRect.left && ev.clientX <= bottomRect.right;
        if(inTop || inBottom){
          if(!Settings.data.pinnedApps.includes(app)){
            Settings.data.pinnedApps.push(app);
            Settings.save();
            Dock.render();
            toast('Закреплено в доке', APP_DEFS[app]?.title || app);
          } else {
            toast('Уже закреплено', APP_DEFS[app]?.title || app, 'ℹ');
          }
        }
      }
    };
    document.addEventListener('pointermove', onMove, {passive:false});
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });
}

function buildDpad(container, onDir){
  const dirs = [ {d:'', cls:'empty'}, {d:'up', label:'▲'}, {d:'', cls:'empty'}, {d:'left', label:'◀'}, {d:'', cls:'empty'}, {d:'right', label:'▶'}, {d:'', cls:'empty'}, {d:'down', label:'▼'}, {d:'', cls:'empty'} ];
  const dpad = document.createElement('div'); dpad.className = 'dpad';
  dirs.forEach(item=>{

    if(item.cls === 'empty'){ b.className = 'empty'; b.tabIndex = -1; }
    else {
      b.textContent = item.label; b.dataset.dir = item.d;
      let interval = null;
      const start = (e)=>{ e.preventDefault(); if(e.pointerId !== undefined) b.setPointerCapture?.(e.pointerId); onDir(item.d); clearInterval(interval); interval = setInterval(()=>onDir(item.d), 120); };
      const stop = ()=>{ clearInterval(interval); interval = null; };
      b.addEventListener('pointerdown', start); b.addEventListener('pointerup', stop); b.addEventListener('pointercancel', stop); b.addEventListener('pointerleave', stop);
    }
    dpad.appendChild(b);
  });
  container.appendChild(dpad); return dpad;
}
