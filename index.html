const MEDIA = {
  candidates: {
    image: ['clip1.jpg','clip2.jpg','clip3.jpg','clip4.jpg','clip5.jpg','clip6.jpg','clip7.jpg','clip8.jpg','clip9.jpg','clip10.jpg','clip11.jpg','clip12.jpg','clip13.jpg','favicon.png','cover.jpg','cover.png','photo1.jpg','photo2.jpg','photo3.jpg','1.jpg','2.jpg','3.jpg','4.jpg','5.jpg','img1.jpg','img2.jpg','img3.jpg'],
    audio: ['Besk.mp3','Mag.mp3','MemEcR.mp3','OstZhi.mp3','PosVal.mp3','RazVol.mp3','track1.mp3','track2.mp3','song.mp3','audio.mp3','1.mp3','2.mp3','3.mp3'],
    video: ['clip1.mp4','clip2.mp4','clip3.mp4','clip4.mp4','clip5.mp4','clip6.mp4','clip7.mp4','clip8.mp4','clip9.mp4','clip10.mp4','clip11.mp4','clip12.mp4','clip13.mp4','video.mp4','video1.mp4','video2.mp4','1.mp4','2.mp4','3.mp4']
  },
  checkImage(url){ return new Promise(resolve=>{ const img = new Image(); img.onload = ()=>resolve(true); img.onerror = ()=>resolve(false); img.src = url + '?t=' + Date.now(); }); },
  checkAudio(url){ return new Promise(resolve=>{ const a = document.createElement('audio'); a.preload = 'metadata'; let done = false; const finish = (ok)=>{ if(done) return; done=true; a.onloadedmetadata=null; a.onerror=null; a.src=''; resolve(ok); }; a.onloadedmetadata = ()=>finish(true); a.onerror = ()=>finish(false); a.src = url + '?t=' + Date.now(); setTimeout(()=>finish(false), 4000); }); },
  checkVideo(url){ return new Promise(resolve=>{ const v = document.createElement('video'); v.preload = 'metadata'; let done = false; const finish = (ok)=>{ if(done) return; done=true; v.onloadedmetadata=null; v.onerror=null; v.src=''; resolve(ok); }; v.onloadedmetadata = ()=>finish(true); v.onerror = ()=>finish(false); v.src = url + '?t=' + Date.now(); setTimeout(()=>finish(false), 4000); }); },
  async check(type, url){ if(type==='image') return this.checkImage(url); if(type==='audio') return this.checkAudio(url); if(type==='video') return this.checkVideo(url); return false; },
  async scan(){
    const found = { image:[], audio:[], video:[] };
    const tasks = [];
    for(const type of ['image','audio','video']){ for(const name of this.candidates[type]) tasks.push(this.check(type, name).then(ok=>{ if(ok) found[type].push(name); })); }
    await Promise.all(tasks); return found;
  }
};

APP_DEFS['media'] = {
  title:'Медиа', icon:'🎞️', svgIcon:'media', w:900, h:640,
  about:'Фото, аудио и видео из папки с кодом', headLeft:'медиа-папка', headRight:'доп. функции',
  mount(body, win){
    const flat = Settings.data.iconMode === 'flat';
    let tab = 'all', items = [], manualItems = [], loading = true, viewIdx = -1;
    body.innerHTML = `<div class="media-hub">
      <h3>Медиатека</h3>
      <div class="sub">Автопоиск рядом с index.html + возможность добавить файлы вручную</div>
      <div class="media-tabs">
        <button data-tab="all" class="active">Все</button>
        <button data-tab="image">Фото</button>
        <button data-tab="audio">Аудио</button>
        <button data-tab="video">Видео</button>
        <button id="mAdd" style="margin-left:auto">＋ Добавить файлы</button>
        <button id="mRefresh">⟳ Обновить</button>
      </div>
      <input type="file" id="mFileInput" multiple accept="image/*,audio/*,video/*" style="display:none">
      <div class="media-grid" id="mGrid"></div>
    </div>`;
    const grid = body.querySelector('#mGrid');
    const fileInput = body.querySelector('#mFileInput');
    function iconSVG(name){ return flat ? `<span class="ico">${SvgIcons[name]}</span>` : ''; }
    function allItems(){ return [...items, ...manualItems]; }
    function render(){
      if(loading){ grid.innerHTML = `<div class="media-empty">Сканирование папки…</div>`; return; }
      const list = allItems();
      const filtered = tab==='all' ? list : list.filter(i=>i.type===tab);
      if(!filtered.length){ grid.innerHTML = `<div class="media-empty">Ничего не найдено.<br><br><b>Вариант 1:</b> положите файлы рядом с index.html и нажмите «⟳ Обновить».<br><br><b>Вариант 2:</b> нажмите «＋ Добавить файлы».</div>`; return; }
      grid.innerHTML = '';
      filtered.forEach((it)=>{
        const el = document.createElement('div');
        const isAudio = it.type==='audio';
        el.className = 'media-card' + (isAudio?' audio':'');
        if(it.type==='image'){ el.innerHTML = `<img src="${esc(it.url)}" alt="${esc(it.name)}" loading="lazy" onerror="this.style.display='none';this.parentNode.style.background='#1a1a1c'"><span class="badge">ФОТО</span><div class="cap">${esc(it.name)}</div>`; }
        else if(it.type==='video'){ el.innerHTML = `<video src="${esc(it.url)}#t=0.5" preload="metadata" muted></video><span class="badge">ВИДЕО</span><div class="cap">${esc(it.name)}</div>`; }
        else { el.innerHTML = `<div class="audio-icon">${iconSVG('music') || '🎵'}</div><div class="cap"><b>${esc(it.name)}</b><br><span style="color:#888;font-size:10.5px">АУДИО</span></div><span class="badge">MP3</span>`; }
        el.onclick = ()=>openView(it, filtered);
        grid.appendChild(el);
      });
    }
    function openView(it, list){
      const idx = list.indexOf(it); viewIdx = idx;
      const old = body.querySelector('.media-view'); if(old) old.remove();
      const v = document.createElement('div'); v.className = 'media-view';
      let mediaHTML = '';
      if(it.type==='image') mediaHTML = `<img src="${esc(it.url)}" alt="">`;
      else if(it.type==='video') mediaHTML = `<video src="${esc(it.url)}" controls autoplay playsinline></video>`;
      else mediaHTML = `<audio src="${esc(it.url)}" controls autoplay></audio>`;
      v.innerHTML = `${mediaHTML}<div class="cap">${esc(it.name)} — ${idx+1} / ${list.length}</div><div class="nav"><button data-d="-1">← Назад</button><button data-d="0">Закрыть</button><button data-d="1">Вперёд →</button></div>`;
      v.querySelectorAll('button').forEach(b=>{ b.onclick = ()=>{ const d = parseInt(b.dataset.d); const vid = v.querySelector('video'); if(vid) vid.pause(); const aud = v.querySelector('audio'); if(aud) aud.pause(); if(d===0){ v.remove(); viewIdx=-1; } else { const n = (idx + d + list.length) % list.length; openView(list[n], list); } }; });
      body.appendChild(v);
    }
    async function scan(){
      loading = true; render();
      const found = await MEDIA.scan();
      items = [];
      found.image.forEach(n => items.push({ type:'image', name:n, url:n }));
      found.audio.forEach(n => items.push({ type:'audio', name:n, url:n }));
      found.video.forEach(n => items.push({ type:'video', name:n, url:n }));
      loading = false; render();
      const total = allItems().length;

    function onDragUp(e){
      if(e.pointerId !== dragPointerId) return;

      if(el){
        el.removeEventListener('pointermove', onDragMove);

        el.removeEventListener('pointercancel', onDragUp);

  }

        ls: ()=>{ const p = args[0] ? FS.resolvePath(cwd, args[0]) : cwd; const items = FS.list(p); if(!items.length){ print('(пусто)','dim'); return; } items.forEach(c=>{ const mark = c.type==='folder' ? '<span class="hi">'+esc(c.name)+'/</span>' : esc(c.name); print('  ' + mark + (c.type==='file'?`  <span class="dim">${fmtSize(c.size||0)}</span>`:'')); }); },
        cd: ()=>{ if(!args[0]){ cwd='/'; render(); return; } const p = FS.resolvePath(cwd, args[0]); const d = FS.find(p); if(!d){ print('cd: нет такой папки: '+args[0], 'err'); return; } if(d.type!=='folder'){ print('cd: это не папка', 'err'); return; } cwd = p; render(); },
        pwd: ()=>print(cwd),

        mkdir: ()=>{ if(!args[0]){ print('mkdir: укажите имя','err'); return; } const r = FS.mkdir(cwd, args[0]); r.ok?print('✓ создано: '+r.name, 'ok'):print('mkdir: '+r.err, 'err'); },
        touch: ()=>{ if(!args[0]){ print('touch: укажите имя','err'); return; } const r = FS.touch(FS.resolvePath(cwd, args[0])); r.ok?print('✓ создан: '+args[0], 'ok'):print('touch: '+r.err, 'err'); },
        rm: ()=>{ if(!args[0]){ print('rm: укажите файл','err'); return; } const r = FS.rm(FS.resolvePath(cwd, args[0])); r.ok?print('✓ удалено: '+args[0], 'ok'):print('rm: '+r.err, 'err'); },
        cp: ()=>{ if(args.length<2){ print('cp: нужно 2 аргумента','err'); return; } const r = FS.cp(FS.resolvePath(cwd, args[0]), FS.resolvePath(cwd, args[1])); r.ok?print('✓ скопировано','ok'):print('cp: '+r.err, 'err'); },
        mv: ()=>{ if(args.length<2){ print('mv: нужно 2 аргумента','err'); return; } const r = FS.mv(FS.resolvePath(cwd, args[0]), FS.resolvePath(cwd, args[1])); r.ok?print('✓ перемещено','ok'):print('mv: '+r.err, 'err'); },

        tree: ()=>{ const p = args[0] ? FS.resolvePath(cwd, args[0]) : cwd; print(esc(FS.name(p)||'/')); print(esc(FS.tree(p))); },

        du: ()=>{ const p = args[0] ? FS.resolvePath(cwd, args[0]) : cwd; const {files, folders, bytes} = FS.du(p); print(`Папок: ${folders}`, 'ok'); print(`Файлов: ${files}`, 'ok'); print(`Размер: ${fmtSize(bytes)}`, 'ok'); },

        accent: ()=>{ const c = (args[0]||'').trim(); if(/^#?[0-9a-f]{6}$/i.test(c)){ const hex = c.startsWith('#') ? c : '#'+c; Settings.set('accent', hex); print('✓ акцент: '+hex, 'ok'); } else print('accent: укажите HEX','err'); },
        bg: ()=>{ const id = (args[0]||'').toLowerCase(); if(BACKGROUNDS.list.find(b=>b.id===id)){ Settings.set('background', id); print('✓ фон: '+id, 'ok'); } else { print('Доступные фоны:', 'hi'); BACKGROUNDS.list.forEach(b=>print('  <span class="hi">'+esc(b.id.padEnd(16))+'</span><span class="dim">'+esc(b.name)+'</span>')); } },
        open: ()=>{ const app = (args[0]||'').toLowerCase(); if(app === 'hello'){ WM.open('welcome', { forceNew:true }); print('✓ окно приветствия открыто','ok'); } else if(APP_DEFS[app]){ WM.open(app); print('✓ открыто: '+app, 'ok'); } else print('open: неизвестно: '+app,'err'); },

    }

    function calc(s){
      try{
        const clean = s.replace(/[^0-9+\-*/().% ]/g,''); if(!clean) return '0';
        const fn = new Function('return (' + clean.replace(/%/g,'/100') + ')');
        const r = fn(); if(!isFinite(r)) return 'Ошибка';
        return Math.round(r * 1e12) / 1e12 + '';
      }catch(e){ return 'Ошибка'; }
    }
    body.querySelectorAll('[data-k]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const k = b.dataset.k;
        if(k==='C' || k==='CE'){ expr=''; val='0'; }
        else if(k==='⌫'){ expr = expr.slice(0,-1); }
        else if(k==='='){ if(!expr) return; const r = calc(expr); expr = expr + ' ='; val = r; update(); setTimeout(()=>{ expr = ''; val = r; update(); }, 900); return; }
        else { expr += k; const p = calc(expr); if(p!=='Ошибка') val = p; }
        update();
      });
    });
    update();
  }
};

      const imgData = ctx.getImageData(0,0,cvs.width,cvs.height);
      const data = imgData.data;
      const startIdx = (y*cvs.width+x)*4;
      const target = [data[startIdx],data[startIdx+1],data[startIdx+2],data[startIdx+3]];
      const fillRgb = hexToRgb(hex);
      if(target[0]===fillRgb[0]&&target[1]===fillRgb[1]&&target[2]===fillRgb[2]) return;
      const stack = [[x,y]];
      const visited = new Uint8Array(cvs.width*cvs.height);
      while(stack.length){
        const [cx,cy] = stack.pop();
        if(cx<0||cy<0||cx>=cvs.width||cy>=cvs.height) continue;
        const i = cy*cvs.width+cx; if(visited[i]) continue; visited[i]=1;
        const pi = i*4;
        if(data[pi]!==target[0]||data[pi+1]!==target[1]||data[pi+2]!==target[2]||data[pi+3]!==target[3]) continue;
        data[pi]=fillRgb[0]; data[pi+1]=fillRgb[1]; data[pi+2]=fillRgb[2]; data[pi+3]=255;
        stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
      }
      ctx.putImageData(imgData, 0, 0);
    }
    setTool('brush');
    return {};
  }

APP_DEFS['game-pong'] = {
  title:'Пинг-понг', icon:'🏓', svgIcon:'pong', w:640, h:440, forceNew:true,
  about:'Отбивай мяч и обыграй соперника', headLeft:'игра', headRight:'доп. функции',
  mount(body, win){
    const W=600, H=380, PADDLE_W=10, PADDLE_H=70, BALL_R=6;
    const shell = gameShell(body, { w:W, h:H, help:'<kbd>↑↓</kbd> или <kbd>W S</kbd> — управление' });
    const ctx = shell.canvas.getContext('2d');
    const accent = Settings.data.accent;
    let pY, aiY, ball, scoreP, scoreA, raf, last;
    function reset(){
      pY = H/2 - PADDLE_H/2; aiY = H/2 - PADDLE_H/2;
      ball = { x:W/2, y:H/2, vx: 4 * (Math.random()>0.5?1:-1), vy: (Math.random()-0.5)*6 };
      scoreP = 0; scoreA = 0; last = performance.now();
      shell.scoreEl.textContent = '0 : 0'; shell.overlay.classList.remove('on');
      cancelAnimationFrame(raf); loop(last);
    }
    function loop(now){
      raf = requestAnimationFrame(loop);
      const dt = Math.min(32, now - last) / 16; last = now;
      ball.x += ball.vx * dt; ball.y += ball.vy * dt;
      if(ball.y < BALL_R || ball.y > H-BALL_R){ ball.vy *= -1; ball.y = Math.max(BALL_R, Math.min(H-BALL_R, ball.y)); }
      const px = 20;
      if(ball.x - BALL_R < px + PADDLE_W && ball.x > px && ball.y > pY && ball.y < pY+PADDLE_H){ ball.vx = Math.abs(ball.vx); ball.x = px + PADDLE_W + BALL_R; }
      const ax = W - 20 - PADDLE_W;
      const target = ball.y - PADDLE_H/2;
      aiY += (target - aiY) * 0.08 * dt; aiY = Math.max(0, Math.min(H-PADDLE_H, aiY));
      if(ball.x + BALL_R > ax && ball.x < ax+PADDLE_W && ball.y > aiY && ball.y < aiY+PADDLE_H){ ball.vx = -Math.abs(ball.vx); ball.x = ax - BALL_R; }
      if(ball.x < -10){ scoreA++; shell.scoreEl.textContent = scoreP + ' : ' + scoreA; ball = { x:W/2, y:H/2, vx:4, vy:(Math.random()-0.5)*6 }; }
      if(ball.x > W+10){ scoreP++; shell.scoreEl.textContent = scoreP + ' : ' + scoreA; ball = { x:W/2, y:H/2, vx:-4, vy:(Math.random()-0.5)*6 }; }
      if(scoreP>=7 || scoreA>=7){ showGameOver(shell, scoreP>scoreA?'Вы победили!':'Игра окончена', 'Счёт: ' + scoreP + ' : ' + scoreA); return; }
      draw();
    }
    function draw(){
      ctx.fillStyle = '#0a0a0c'; ctx.fillRect(0,0,W,H);
      ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.setLineDash([6,8]);
      ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fillRect(20, pY, PADDLE_W, PADDLE_H);
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(W-30, aiY, PADDLE_W, PADDLE_H);
      ctx.fillStyle = accent; ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2); ctx.fill();
    }
    function onKey(e){ if(e.key==='ArrowUp'||e.key==='w'||e.key==='W'){ pY = Math.max(0, pY-28); e.preventDefault(); } else if(e.key==='ArrowDown'||e.key==='s'||e.key==='S'){ pY = Math.min(H-PADDLE_H, pY+28); e.preventDefault(); } }
    document.addEventListener('keydown', onKey);
    let dragging = false; const cvs = shell.canvas;
    function onCvsDown(e){ e.preventDefault(); dragging = true; cvs.setPointerCapture?.(e.pointerId); onCvsMove(e); }
    function onCvsMove(e){ if(!dragging) return; e.preventDefault(); const r = shell.canvas.getBoundingClientRect(); const y = (e.clientY - r.top) * H / r.height; pY = Math.max(0, Math.min(H-PADDLE_H, y - PADDLE_H/2)); }
    function onCvsUp(e){ dragging = false; cvs.releasePointerCapture?.(e.pointerId); }
    cvs.addEventListener('pointerdown', onCvsDown);
    cvs.addEventListener('pointermove', onCvsMove);
    cvs.addEventListener('pointerup', onCvsUp);
    cvs.addEventListener('pointercancel', onCvsUp);
    shell.restartBtn.onclick = reset; shell.overlayBtn.onclick = reset;
    win.onWindowMenu = ()=>[{t:'Заново', i:'⟲', fn:reset}];
    reset();
  }
};

APP_DEFS['game-runner'] = {
  title:'Бигэн', icon:'🏃', svgIcon:'runner', w:640, h:400, forceNew:true,
  about:'Прыгай через препятствия', headLeft:'игра', headRight:'доп. функции',
  mount(body, win){
    const W=600, H=340, GROUND=270, PLAYER_W=26, PLAYER_H=40;
    const shell = gameShell(body, { w:W, h:H, help:'<kbd>Space</kbd> / <kbd>↑</kbd> — прыжок' });
    const ctx = shell.canvas.getContext('2d');
    const accent = Settings.data.accent;
    let py, vy, obstacles, speed, score, alive, raf, last, spawnAcc;
    function reset(){ py = GROUND - PLAYER_H; vy = 0; obstacles = []; speed = 6; score = 0; alive = true; spawnAcc = 0; last = performance.now(); shell.scoreEl.textContent = 0; shell.overlay.classList.remove('on'); cancelAnimationFrame(raf); loop(last); }
    function loop(now){
      raf = requestAnimationFrame(loop); if(!alive) return;
      const dt = Math.min(32, now-last)/16; last = now;
      vy += 0.9 * dt; py += vy * dt;
      if(py >= GROUND-PLAYER_H){ py = GROUND-PLAYER_H; vy = 0; }
      spawnAcc += dt;

      obstacles = obstacles.filter(o=>o.x + o.w > -10);
      obstacles.forEach(o=>{ const obsTop = GROUND - o.h; if(py + PLAYER_H > obsTop && py < GROUND && o.x < 60+PLAYER_W && o.x + o.w > 60){ alive = false; showGameOver(shell, 'Игра окончена', 'Счёт: ' + score); } });
      obstacles.forEach(o=>{ if(!o.passed && o.x + o.w < 60){ o.passed = true; score += 10; speed += 0.2; shell.scoreEl.textContent = score; } });
      draw();
    }
    function draw(){
      ctx.fillStyle = '#0a0a0c'; ctx.fillRect(0,0,W,H);
      ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.lineTo(W,GROUND); ctx.stroke();
      ctx.fillStyle = accent; ctx.fillRect(60, py, PLAYER_W, PLAYER_H);
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      obstacles.forEach(o=>ctx.fillRect(o.x, GROUND-o.h, o.w, o.h));
    }
    function jump(){ if(py >= GROUND-PLAYER_H-1){ vy = -15; } }
    function onKey(e){ if(e.key===' '||e.key==='ArrowUp'||e.key==='w'){ jump(); e.preventDefault(); } }
    document.addEventListener('keydown', onKey);
    shell.canvas.addEventListener('pointerdown', e=>{ e.preventDefault(); jump(); });
    buildActionButton(shell.touchEl, '⬆', jump);
    shell.restartBtn.onclick = reset; shell.overlayBtn.onclick = reset;
    win.onWindowMenu = ()=>[{t:'Заново', i:'⟲', fn:reset}];
    reset();
  }
};

APP_DEFS['game-memory'] = {
  title:'Память', icon:'🧠', svgIcon:'memory', w:520, h:560, forceNew:true,
  about:'Найди все пары карточек', headLeft:'игра', headRight:'доп. функции',
  mount(body, win){
    const COLS=4, ROWS=4, CARD=100, GAP=10, PAD=20;
    const W = PAD*2 + COLS*CARD + (COLS-1)*GAP;
    const H = PAD*2 + ROWS*CARD + (ROWS-1)*GAP;
    const shell = gameShell(body, { w:W, h:H, help:'Клик — открыть карточку. Найди все пары!' });
    const ctx = shell.canvas.getContext('2d');
    const accent = Settings.data.accent;
    let cards, first, second, lock, moves;
    function reset(){
      const icons = ['★','♥','◆','●','▲','■','✦','♦'];
      const deck = [...icons, ...icons].sort(()=>Math.random()-0.5);
      cards = deck.map((sym,i)=>({ sym, open:false, done:false, x: PAD + (i%COLS)*(CARD+GAP), y: PAD + Math.floor(i/COLS)*(CARD+GAP) }));
      first = null; second = null; lock = false; moves = 0;
      shell.scoreEl.textContent = '0'; shell.overlay.classList.remove('on');
      draw();
    }
    function draw(){
      ctx.fillStyle = '#0a0a0c'; ctx.fillRect(0,0,W,H);
      cards.forEach(c=>{
        ctx.save();
        ctx.fillStyle = c.done ? 'rgba(255,255,255,0.08)' : (c.open ? accent : 'rgba(255,255,255,0.05)');
        ctx.strokeStyle = c.open || c.done ? accent : 'rgba(255,255,255,0.12)';
        ctx.lineWidth = 1.5;
        roundRect(ctx, c.x, c.y, CARD, CARD, 10); ctx.fill(); ctx.stroke();
        if(c.open || c.done){ ctx.fillStyle = c.done ? 'rgba(255,255,255,0.85)' : '#fff'; ctx.font = 'bold 44px Inter,Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(c.sym, c.x+CARD/2, c.y+CARD/2+2); }
        ctx.restore();
      });
    }
    function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
    function handleTap(clientX, clientY){
      if(lock) return;
      const r = shell.canvas.getBoundingClientRect();
      const mx = (clientX - r.left) * W / r.width;
      const my = (clientY - r.top) * H / r.height;
      for(const c of cards){
        if(mx>=c.x && mx<=c.x+CARD && my>=c.y && my<=c.y+CARD && !c.open && !c.done){
          c.open = true;
          if(!first){ first = c; }
          else {
            second = c; lock = true;
            if(first.sym === second.sym){ first.done = second.done = true; first=null; second=null; lock=false; draw(); }
            else { moves++; shell.scoreEl.textContent = moves; draw(); setTimeout(()=>{ first.open=false; second.open=false; first=null; second=null; lock=false; draw(); }, 700); }
          }
          draw();
          if(cards.every(x=>x.done)){ setTimeout(()=>showGameOver(shell, 'Победа!', 'Ходов: ' + moves), 300); }
          break;
        }
      }
    }
    shell.canvas.addEventListener('click', e=>handleTap(e.clientX, e.clientY));
    shell.canvas.addEventListener('pointerdown', e=>{ e.preventDefault(); handleTap(e.clientX, e.clientY); });
    shell.restartBtn.onclick = reset; shell.overlayBtn.onclick = reset;
    win.onWindowMenu = ()=>[{t:'Заново', i:'⟲', fn:reset}];
    reset();
  }
};

/* ============================================================
   О СИСТЕМЕ 1.4 — 3 колонки, адаптив по ширине ОКНА
   ============================================================ */
function detectHostInfo(){
  const ua = navigator.userAgent;
  let hostOS = 'Неизвестно';
  if (/Windows NT 10\.0/.test(ua)) hostOS = 'Windows 10/11';
  else if (/Windows NT 6\.3/.test(ua)) hostOS = 'Windows 8.1';
  else if (/Windows NT 6\.2/.test(ua)) hostOS = 'Windows 8';
  else if (/Windows NT 6\.1/.test(ua)) hostOS = 'Windows 7';
  else if (/Mac OS X/.test(ua)) hostOS = 'macOS';
  else if (/Android/.test(ua)) hostOS = 'Android';
  else if (/iPhone|iPad|iPod/.test(ua)) hostOS = 'iOS';
  else if (/CrOS/.test(ua)) hostOS = 'ChromeOS';
  else if (/Linux/.test(ua)) hostOS = 'Linux';
  else hostOS = navigator.platform || 'Неизвестно';

  const cpuCores = navigator.hardwareConcurrency || null;
  const ram = navigator.deviceMemory ? (navigator.deviceMemory + ' ГБ') : null;
  const platform = navigator.platform || '—';
  const lang = navigator.language || '—';
  const langs = (navigator.languages || []).slice(0,3).join(', ') || '—';
  let tz = '—';
  try{ tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '—'; }catch(e){}
  const cookies = navigator.cookieEnabled ? 'включены' : 'выключены';
  const dnt = navigator.doNotTrack === '1' ? 'включён' : 'выключен';
  const touch = (('ontouchstart' in window) || (navigator.maxTouchPoints > 0)) ? 'есть (' + (navigator.maxTouchPoints||0) + ')' : 'нет';
  const online = navigator.onLine ? 'online' : 'offline';
  const screenRes = `${window.screen.width}×${window.screen.height}`;
  const dpr = window.devicePixelRatio ? window.devicePixelRatio.toFixed(2) : '1';
  const colorDepth = window.screen.colorDepth ? window.screen.colorDepth + ' бит' : '—';

  let browser = 'Неизвестно';
  let bVer = '';
  if (/YaBrowser\/([\d.]+)/.test(ua)) { browser = 'Yandex'; bVer = RegExp.$1.split('.').slice(0,2).join('.'); }
  else if (/OPR\/([\d.]+)/.test(ua)) { browser = 'Opera'; bVer = RegExp.$1.split('.')[0]; }
  else if (/Edg\/([\d.]+)/.test(ua)) { browser = 'Edge'; bVer = RegExp.$1.split('.')[0]; }
  else if (/Chrome\/([\d.]+)/.test(ua) && !/Chromium/.test(ua)) { browser = 'Chrome'; bVer = RegExp.$1.split('.')[0]; }
  else if (/Firefox\/([\d.]+)/.test(ua)) { browser = 'Firefox'; bVer = RegExp.$1.split('.')[0]; }
  else if (/Version\/([\d.]+).*Safari/.test(ua)) { browser = 'Safari'; bVer = RegExp.$1.split('.')[0]; }

  return {
    hostOS, cpuCores, ram, platform, lang, langs, tz, cookies, dnt, touch, online,
    screenRes, dpr, colorDepth,
    browser, bVer,
    browserFull: bVer ? (browser + ' ' + bVer) : browser
  };
}

          <span id="ckStatus">Готово</span><span id="ckTitle">Cooke</span>
        </div>
      </div>`;
    const frame   = body.querySelector('#ckFrame');
    const urlInp  = body.querySelector('#ckUrl');
    const statusEl= body.querySelector('#ckStatus');
    const titleEl = body.querySelector('#ckTitle');
    const blockEl = body.querySelector('#ckBlock');
    const tabsEl  = body.querySelector('#ckTabs');
    const tabs = []; let activeTabId = null;
    function newTab(url){ const t = { id: uid(), url: url || HOME, title: 'Новая вкладка', history: [url || HOME], hi: 0 }; tabs.push(t); activeTabId = t.id; renderTabs(); navigate(t.url, false); return t; }
    function activeTab(){ return tabs.find(t => t.id === activeTabId); }
    function renderTabs(){
      tabsEl.innerHTML = '';
      tabs.forEach(t => {
        const el = document.createElement('div');
        const isActive = t.id === activeTabId;
        el.style.cssText = `display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;cursor:pointer;font-size:11.5px;font-weight:700;white-space:nowrap;max-width:220px;background:${isActive?'linear-gradient(135deg,var(--accent-soft),transparent)':'rgba(255,255,255,.04)'};border:1px solid ${isActive?'var(--accent)':'rgba(255,255,255,.08)'};color:${isActive?'#fff':'#bbb'}`;
        el.innerHTML = `<span style="overflow:hidden;text-overflow:ellipsis;max-width:170px">${esc(t.title)}</span><span data-close="${t.id}" style="opacity:.6;font-weight:900">×</span>`;
        el.onclick = (e) => { if(e.target.dataset.close){ e.stopPropagation(); closeTab(t.id); return; } activeTabId = t.id; renderTabs(); navigate(t.history[t.hi], false); };
        tabsEl.appendChild(el);
      });
    }
    function closeTab(id){
      const i = tabs.findIndex(t => t.id === id); if(i < 0) return;
      tabs.splice(i, 1);
      if(!tabs.length){ newTab(); return; }
      if(activeTabId === id){ activeTabId = tabs[Math.max(0, i-1)].id; navigate(activeTab().history[activeTab().hi], false); }
      renderTabs();
    }
    function normalizeURL(input){ let s = String(input || '').trim(); if(!s) return HOME; if(/^https?:\/\//i.test(s)) return s; if(/^[\w-]+(\.[\w-]+)+(\/.*)?$/i.test(s)) return 'https://' + s; return 'https://www.google.com/search?igu=1&q=' + encodeURIComponent(s); }
    function setStatus(txt){ statusEl.textContent = txt; }
    function showBlock(show){ blockEl.style.display = show ? 'flex' : 'none'; }
    let loadTimeout = null;
    function navigate(url, pushHistory = true){
      const t = activeTab(); if(!t) return;
      url = normalizeURL(url); t.url = url;
      if(pushHistory){ t.history = t.history.slice(0, t.hi+1); t.history.push(url); t.hi = t.history.length - 1; }
      urlInp.value = url; setStatus('Загрузка…'); showBlock(false);
      try{ frame.src = url; }catch(e){ setStatus('Ошибка загрузки'); }
      clearTimeout(loadTimeout);
      loadTimeout = setTimeout(()=>{ if(t.url === url && t.title === 'Новая вкладка'){ showBlock(true); setStatus('Сайт запрещает iframe — попробуйте ↗'); } }, 4500);
      renderTabs();
    }
    frame.addEventListener('load', ()=>{
      clearTimeout(loadTimeout);
      try{ const t = activeTab(); let title = 'Загружено'; try{ title = frame.contentDocument?.title || t.url; }catch(e){ title = t.url; } t.title = title.length > 40 ? title.slice(0,40)+'…' : title; titleEl.textContent = t.title; win.title = 'Cooke — ' + t.title; setStatus('Готово'); }catch(e){ setStatus('Готово'); }
      renderTabs(); updateNavButtons();
    });
    function updateNavButtons(){
      const t = activeTab(); if(!t) return;
      body.querySelector('#ckBack').style.opacity   = t.hi > 0 ? '1' : '.35';
      body.querySelector('#ckFwd').style.opacity    = t.hi < t.history.length-1 ? '1' : '.35';
    }
    body.querySelector('#ckBack').onclick = ()=>{ const t = activeTab(); if(!t || t.hi<=0) return; t.hi--; navigate(t.history[t.hi], false); updateNavButtons(); };
    body.querySelector('#ckFwd').onclick = ()=>{ const t = activeTab(); if(!t || t.hi>=t.history.length-1) return; t.hi++; navigate(t.history[t.hi], false); updateNavButtons(); };
    body.querySelector('#ckReload').onclick = ()=>{ const t = activeTab(); if(!t) return; setStatus('Обновление…'); frame.src = 'about:blank'; setTimeout(()=>{ frame.src = t.url; }, 40); };
    body.querySelector('#ckHome').onclick   = ()=>navigate(HOME);
    body.querySelector('#ckGo').onclick     = ()=>navigate(urlInp.value);
    body.querySelector('#ckNewTab').onclick = ()=>newTab();
    body.querySelector('#ckOpen').onclick   = ()=>{ const t = activeTab(); if(t) window.open(t.url, '_blank', 'noopener'); };
    body.querySelector('#ckExternal').onclick = ()=>{ const t = activeTab(); if(t) window.open(t.url, '_blank', 'noopener'); };
    body.querySelector('#ckRetry').onclick = ()=>{ const t = activeTab(); if(t){ showBlock(false); frame.src = t.url; } };
    urlInp.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); navigate(urlInp.value); } });
    urlInp.addEventListener('focus', ()=>urlInp.select());
    const onKey = (e)=>{
      if(!win.el || !win.el.contains(document.activeElement)) return;
      if(e.ctrlKey && e.key.toLowerCase()==='l'){ e.preventDefault(); urlInp.focus(); }
      if(e.ctrlKey && e.key.toLowerCase()==='r'){ e.preventDefault(); body.querySelector('#ckReload').click(); }
      if(e.ctrlKey && e.key.toLowerCase()==='t'){ e.preventDefault(); newTab(); }
      if(e.altKey && e.key==='ArrowLeft'){  e.preventDefault(); body.querySelector('#ckBack').click(); }
      if(e.altKey && e.key==='ArrowRight'){ e.preventDefault(); body.querySelector('#ckFwd').click(); }
    };
    document.addEventListener('keydown', onKey);
    win._cookeCleanup = ()=>document.removeEventListener('keydown', onKey);
    newTab(HOME); updateNavButtons();
    return {};
  }
};

    updateRange('regDockAppRadius', 'dockAppRadius');

    body.querySelector('#regWinBtnOrder').onchange = (e)=>{ Settings.data.winBtnOrder = e.target.value; Settings.save(); Settings.apply(); };
    const pinnedContainer = body.querySelector('#regPinnedList');
    const allApps = Object.keys(APP_DEFS).filter(a=>!a.startsWith('game-') && a!=='welcome' && a!=='regedit');
    allApps.forEach(app=>{
      const d = APP_DEFS[app];
      if(!d) return;
      const chip = document.createElement('div');
      const isPinned = Settings.data.pinnedApps.includes(app);
      chip.style.cssText = `display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;cursor:pointer;font-size:12px;font-weight:700;border:1px solid ${isPinned?'var(--accent)':'rgba(255,255,255,.1)'};background:${isPinned?'var(--accent-soft)':'rgba(255,255,255,.04)'};color:${isPinned?'#fff':'#bbb'}`;
      chip.innerHTML = `${d.icon || '📦'} ${d.title}`;
      chip.onclick = ()=>{
        if(Settings.data.pinnedApps.includes(app)){ Settings.data.pinnedApps = Settings.data.pinnedApps.filter(a=>a!==app); }
        else { Settings.data.pinnedApps.push(app); }
        Settings.save(); Dock.render();
        const isPinnedNow = Settings.data.pinnedApps.includes(app);
        chip.style.borderColor = isPinnedNow ? 'var(--accent)' : 'rgba(255,255,255,.1)';
        chip.style.background = isPinnedNow ? 'var(--accent-soft)' : 'rgba(255,255,255,.04)';
        chip.style.color = isPinnedNow ? '#fff' : '#bbb';
      };
      pinnedContainer.appendChild(chip);
    });
    body.querySelector('#regResetAll').onclick = ()=>{
      if(!confirm('Сбросить все настройки реестра к значениям по умолчанию?')) return;
      Settings.data.winRadius = 24; Settings.data.winRadiusMax = 0;
      Settings.data.dockRadius = 30; Settings.data.dockAppRadius = 12;
      Settings.data.startMenuRadius = 32; Settings.data.winBtnOrder = 'center';
      Settings.data.pinnedApps = ['cooke','files','terminal'];
      Settings.save(); Settings.apply();
      body.querySelector('#regWinRadius').value = 24;
      body.querySelector('#regWinRadius').parentElement.querySelector('.val-preview').textContent = '24px';
      body.querySelector('#regWinRadiusMax').value = 0;
      body.querySelector('#regWinRadiusMax').parentElement.querySelector('.val-preview').textContent = '0px';
      body.querySelector('#regDockRadius').value = 30;
      body.querySelector('#regDockRadius').parentElement.querySelector('.val-preview').textContent = '30px';
      body.querySelector('#regDockAppRadius').value = 12;
      body.querySelector('#regDockAppRadius').parentElement.querySelector('.val-preview').textContent = '12px';
      body.querySelector('#regStartMenuRadius').value = 32;
      body.querySelector('#regStartMenuRadius').parentElement.querySelector('.val-preview').textContent = '32px';
      body.querySelector('#regWinBtnOrder').value = 'center';
      toast('Реестр сброшен', 'Настройки по умолчанию');
      WM.open('regedit', { forceNew:true });
    };
  }
};

/* МЕНЮ ПУСК */
StartMenu = {
  el: null,
  init(){
    this.el = $('#startMenu');
    const apps = [
      {app:'cooke',    icon:'🌐', svg:'browser', name:'Cooke',       desc:'Браузер с выходом в интернет'},
      {app:'files',    icon:'📁', svg:'folder',   name:'Проводник',   desc:'Файловая система'},
      {app:'terminal', icon:'▸_', svg:'terminal', name:'Терминал',    desc:'mict-26'},
      {app:'paint',    icon:'🎨', svg:'paint',    name:'Paint',       desc:'Рисование'},
      {app:'media',    icon:'🎞️', svg:'media',    name:'Медиа',       desc:'Фото, аудио, видео'},
      {app:'games',    icon:'🎮', svg:'games',    name:'Игры',        desc:'5 аркадный игр'},
      {app:'calc',     icon:'🧮', svg:'calc',     name:'Калькулятор', desc:'Считовот ты, жи есть'},
      {app:'notes',    icon:'📝', svg:'text',     name:'Блокнот',     desc:'Текста'},
      {app:'settings', icon:'⚙️', svg:'settings', name:'Настройки',   desc:'Кастомизация'},
      {app:'about',    icon:'ℹ️', svg:'info',     name:'О системе',   desc:'Mict OS 1.4'}
    ];
    const container = $('#smApps');
    this.refresh = ()=>{
      const flat = Settings.data.iconMode === 'flat';
      container.innerHTML = apps.map(a=>{
        const ico = flat ? `<span class="ico">${SvgIcons[a.svg]}</span>` : `<span style="font-size:17px">${a.icon}</span>`;
        return `<div class="sm-app" data-app="${a.app}"><div class="ic">${ico}</div><div class="txt"><b>${a.name}</b><small>${a.desc}</small></div></div>`;
      }).join('');
      container.querySelectorAll('.sm-app').forEach(el=>{ el.onclick = ()=>{ WM.open(el.dataset.app); this.close(); }; });
    };
    this.refresh();
    $('#smSearch').addEventListener('input', e=>{ const q = e.target.value.toLowerCase(); container.querySelectorAll('.sm-app').forEach(el=>{ el.style.display = el.textContent.toLowerCase().includes(q) ? 'flex' : 'none'; }); });
    $('#smSettings').onclick = ()=>{ WM.open('settings'); this.close(); };
    $('#smAbout').onclick = ()=>{ WM.open('about'); this.close(); };
    $('#smExit').onclick = ()=>{ if(confirm('Выйти из Mict OS и перейти на index.html?')) window.location.href = 'index.html'; };
    document.addEventListener('pointerdown', e=>{
      if(!this.el.classList.contains('on')) return;
      if(this.el.contains(e.target)) return;
      if(e.target.closest('#tbLogo')) return;
      this.close();
    });
    window.addEventListener('resize', ()=>this.position());
    window.addEventListener('scroll', ()=>this.position(), true);
  },
  position(){
    if(!this.el) return;
    const logo = $('#tbLogo'); if(!logo) return;
    const r = logo.getBoundingClientRect();
    const menuW = this.el.offsetWidth || 340;
    const menuH = this.el.offsetHeight || 400;
    let left = r.left, top;
    const dockBottom = document.body.classList.contains('dock-bottom');
    if(dockBottom){ top = r.top - menuH - 6; if(top < 8) top = 8; }
    else { top = r.bottom + 6; if(top + menuH > window.innerHeight - 8) top = Math.max(8, r.top - menuH - 6); }
    if(left + menuW > window.innerWidth - 8) left = window.innerWidth - menuW - 8;
    if(left < 8) left = 8;
    this.el.style.left = left + 'px';
    this.el.style.top  = top + 'px';
  },
  toggle(){ this.el.classList.contains('on') ? this.close() : this.open(); },
  open(){ this.el.classList.add('on'); requestAnimationFrame(()=>this.position()); setTimeout(()=>$('#smSearch').focus(), 50); },
  close(){ this.el.classList.remove('on'); $('#smSearch').value=''; $$('#smApps .sm-app').forEach(el=>el.style.display='flex'); }
};
StartMenu.init();

/* КАЛЕНДАРЬ */
const Calendar = {
  el: null, currentDate: new Date(),
  init(){
    this.el = $('#calendarPopup');
    const clock = $('#clock');
    clock.addEventListener('click', (e)=>{ e.stopPropagation(); this.toggle(); });
    document.addEventListener('pointerdown', (e)=>{
      if(!this.el.classList.contains('on')) return;
      if(this.el.contains(e.target)) return;
      if(e.target.closest('#clock')) return;
      this.close();
    });
    window.addEventListener('resize', ()=>{ if(this.el.classList.contains('on')) this.position(); });
  },
  position(){
    const clock = $('#clock'); if(!clock) return;
    const r = clock.getBoundingClientRect();
    const rect = this.el.getBoundingClientRect();
    let left = r.left - rect.width/2 + r.width/2;
    let top = r.bottom + 8;
    if(left + rect.width > window.innerWidth - 8) left = window.innerWidth - rect.width - 8;
    if(left < 8) left = 8;
    if(top + rect.height > window.innerHeight - 8) top = r.top - rect.height - 8;
    if(top < 8) top = 8;
    this.el.style.left = left + 'px';
    this.el.style.top  = top + 'px';
  },
  render(){
    const d = this.currentDate;
    const year = d.getFullYear();
    const month = d.getMonth();
    const today = new Date();
    const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    const dow = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
    $('#calMonth').textContent = monthNames[month] + ' ' + year;
    const firstDay = new Date(year, month, 1);
    const startDay = (firstDay.getDay() + 6) % 7;
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const prevDays = new Date(year, month, 0).getDate();
    const grid = $('#calGrid');
    grid.innerHTML = '';
    dow.forEach(d => { const el = document.createElement('div'); el.className = 'cal-dow'; el.textContent = d; grid.appendChild(el); });
    for(let i = startDay - 1; i >= 0; i--){ const el = document.createElement('div'); el.className = 'cal-day other'; el.textContent = prevDays - i; grid.appendChild(el); }
    for(let day = 1; day <= daysInMonth; day++){
      const el = document.createElement('div');
      el.className = 'cal-day';
      const dateObj = new Date(year, month, day);
      const isToday = dateObj.toDateString() === today.toDateString();
      if(isToday) el.classList.add('today');
      if(dateObj.getDay() === 0 || dateObj.getDay() === 6) el.classList.add('weekend');
      el.textContent = day;
      grid.appendChild(el);
    }
    const totalCells = startDay + daysInMonth;
    const remaining = (7 - (totalCells % 7)) % 7;
    for(let i = 1; i <= remaining; i++){ const el = document.createElement('div'); el.className = 'cal-day other'; el.textContent = i; grid.appendChild(el); }
  },
  toggle(){
    if(this.el.classList.contains('on')){ this.close(); return; }
    this.currentDate = new Date();
    this.render();
    this.el.classList.add('on');
    requestAnimationFrame(()=>this.position());
  },
  close(){ this.el.classList.remove('on'); }
};
Calendar.init();
$('#calPrev').onclick = (e)=>{ e.stopPropagation(); Calendar.currentDate.setMonth(Calendar.currentDate.getMonth()-1); Calendar.render(); };
$('#calNext').onclick = (e)=>{ e.stopPropagation(); Calendar.currentDate.setMonth(Calendar.currentDate.getMonth()+1); Calendar.render(); };

/* КОНТЕКСТНОЕ МЕНЮ */
function showCtx(x, y, items){
  const el = $('#ctx');
  el.innerHTML = '';
  items.forEach(it=>{
    if(it.sep){ const s=document.createElement('div'); s.className='sep'; el.appendChild(s); return; }
    const b = document.createElement('button');
    b.className = it.danger ? 'danger' : '';
    if(it.disabled){ b.disabled = true; b.style.opacity = '.4'; b.style.cursor = 'not-allowed'; }
    b.innerHTML = `<span>${it.i||''}</span><span>${esc(it.t)}</span>`;
    b.onclick = ()=>{ if(it.disabled) return; hideCtx(); it.fn && it.fn(); };
    el.appendChild(b);
  });
  el.style.left = '0px'; el.style.top = '0px'; el.classList.add('on');
  const rect = el.getBoundingClientRect();
  const mw = rect.width, mh = rect.height;
  let px = x, py = y;
  if(px + mw > innerWidth - 8) px = innerWidth - mw - 8;
  if(px < 8) px = 8;
  if(py + mh > innerHeight - 8) py = y - mh;
  if(py < 8) py = 8;
  el.style.left = px + 'px';
  el.style.top  = py + 'px';
}
function hideCtx(){ $('#ctx').classList.remove('on'); }
document.addEventListener('pointerdown', e=>{ if(!e.target.closest('#ctx')) hideCtx(); });
document.addEventListener('contextmenu', e=>{
  if(e.target.closest('.win-body')) return;
  if(e.target.closest('#topbar') || e.target.closest('#bottomDock')){
    e.preventDefault();
    const S = Settings.data;
    showCtx(e.clientX, e.clientY, [
      {t: S.theme==='light' ? '🌙 Тёмная тема' : '☀️ Светлая тема', i:'', fn:()=>Settings.set('theme', S.theme==='light'?'dark':'light')},
      {sep:true},
      {t:'⬆ Док сверху', i:'', fn:()=>Settings.set('dockPosition','top')},
      {t:'⬇ Док снизу', i:'', fn:()=>Settings.set('dockPosition','bottom')},
      {t:'↕ Разделённый', i:'', fn:()=>Settings.set('dockPosition','split')},
      {t:'◌ Скрыть док', i:'', fn:()=>Settings.set('dockPosition','hidden')},
      {sep:true},
      {t:'⚙ Настройки', i:'', fn:()=>WM.open('settings')},
      {t:'ℹ О системе', i:'', fn:()=>WM.open('about')},
      {t:'▣ Задачи', i:'', fn:()=>toggleTaskView()},
      {sep:true},
      {t:'— Свернуть все окна', i:'', fn:()=>WM.toggleAll()}
    ]);
    return;
  }
  if(e.target.closest('#workspace')){
    e.preventDefault();
    showCtx(e.clientX, e.clientY, [
      {t:'Открыть Cooke', i:'🌐', fn:()=>WM.open('cooke')},
      {t:'Открыть терминал', i:'▸', fn:()=>WM.open('terminal')},
      {t:'Открыть проводник', i:'📁', fn:()=>WM.open('files')},
      {t:'Открыть Paint', i:'🎨', fn:()=>WM.open('paint')},
      {t:'Открыть Медиа', i:'🎞️', fn:()=>WM.open('media')},
      {t:'Открыть Игры', i:'🎮', fn:()=>WM.open('games')},
      {sep:true},
      {t:'Сменить тему', i:'🎨', fn:()=>Settings.set('theme', document.documentElement.hasAttribute('data-theme')?'dark':'light')},
      {t:'Свернуть все окна', i:'—', fn:()=>WM.toggleAll()},
      {t:'Открыть настройки', i:'⚙', fn:()=>WM.open('settings')}
    ]);
  }
});

/* ВЕРХНЯЯ ПАНЕЛЬ */
$('#tbLogo').onclick = ()=>StartMenu.toggle();
$('#tbHideAll').onclick = ()=>WM.toggleAll();

function toggleTaskView(){
  const tv = $('#taskview');
  if(tv.classList.contains('on')){ tv.classList.remove('on'); return; }
  tv.innerHTML = '';
  if(!WM.wins.length){ tv.innerHTML = '<div style="color:#888;font-size:13px">Нет открытых окон</div>'; }
  else {
    WM.wins.forEach(w=>{
      const el = document.createElement('div');
      el.className = 'tv';
      const d = APP_DEFS[w.app];
      const flat = Settings.data.iconMode === 'flat';
      const ico = flat && d?.svgIcon ? `<span class="ico">${SvgIcons[d.svgIcon]}</span>` : `<span style="font-size:38px">${d?.icon || '📦'}</span>`;
      el.innerHTML = `<div class="ic">${ico}</div><div class="nm">${esc(w.title)}</div>`;
      el.onclick = ()=>{ tv.classList.remove('on'); if(w.minimized) WM.unminimize(w); WM.focus(w); };
      tv.appendChild(el);
    });
  }
  tv.classList.add('on');
  tv.onclick = (e)=>{ if(e.target===tv) tv.classList.remove('on'); };
}

function tickClock(){
  const d = new Date();
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  const mo = String(d.getMonth()+1).padStart(2,'0');
  $('#clock').innerHTML = `${hh}:${mm}<small>${dd}.${mo}</small>`;
}
tickClock(); setInterval(tickClock, 1000*10);

document.addEventListener('keydown', e=>{
  if(e.ctrlKey && e.altKey && e.key.toLowerCase()==='t'){ e.preventDefault(); WM.open('terminal'); }
  if(e.ctrlKey && e.altKey && e.key.toLowerCase()==='f'){ e.preventDefault(); WM.open('files'); }
  if(e.ctrlKey && e.altKey && e.key.toLowerCase()==='c'){ e.preventDefault(); WM.open('calc'); }
  if(e.ctrlKey && e.altKey && e.key.toLowerCase()==='n'){ e.preventDefault(); WM.open('notes'); }
  if(e.ctrlKey && e.altKey && e.key.toLowerCase()==='p'){ e.preventDefault(); WM.open('paint'); }
  if(e.ctrlKey && e.altKey && e.key.toLowerCase()==='g'){ e.preventDefault(); WM.open('games'); }
  if(e.ctrlKey && e.altKey && e.key.toLowerCase()==='m'){ e.preventDefault(); WM.open('media'); }
  if(e.ctrlKey && e.altKey && e.key.toLowerCase()==='s'){ e.preventDefault(); WM.open('settings'); }
  if(e.ctrlKey && e.altKey && e.key.toLowerCase()==='r'){ e.preventDefault(); WM.open('regedit'); }
  if(e.altKey && e.key==='Tab'){ e.preventDefault(); toggleTaskView(); }
  if(e.key==='Escape'){ $('#taskview').classList.remove('on'); hideCtx(); StartMenu.close(); Calendar.close(); }
});

Settings.load();
applyDockPosition();
BACKGROUNDS.init();
BACKGROUNDS.set(Settings.data.background || 'none');
BACKGROUNDS.setSpeed(Settings.data.bgSpeed ?? 1);

Dock.render();
initStartMenuDrag();

setTimeout(()=>{
  $('#boot').classList.add('hide');
  setTimeout(()=>{
    if(!Settings.data.firstRunDone){
      WM.open('welcome', { x:120, y:80, w:780, h:640 });
      Settings.data.firstRunDone = true;
      Settings.save();
    } else {
      toast('Добро пожаловать в Mict OS 1.4','Профиль: ' + UID);
    }
  }, 700);
}, 2200);

window.MICT_OS = { FS, WM, APP_DEFS, Settings, StartMenu, Dock, BACKGROUNDS, Calendar, toast };

})();
